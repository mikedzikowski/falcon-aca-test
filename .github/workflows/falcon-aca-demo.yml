# falcon-aca-demo.yml
# GitHub Actions workflow: patch a container image with the CrowdStrike Falcon
# Container sensor, gate it against a Falcon image-assessment POLICY, and deploy
# the patched image to Azure Container Apps, Azure Container Instances, and/or
# Azure App Service on success.
#
# DEMO KNOB: `demoScenario` selects which (if any) defect is baked into the
# workload image so you can show the image-assessment gate blocking each
# detection type, then flip to `clean` to show it pass and deploy.
#
#   clean         -> healthy app            -> gate PASSES  -> deploys
#   vulnerability -> aiohttp==3.9.1          -> CVE-2024-23334 -> gate BLOCKS
#   malware       -> pull known-malware img  -> malware detection -> gate BLOCKS
#
# The gate itself lives in the Falcon console (image-assessment policy
# "mikedz-aca-demo-gate", scoped to this repo). The fcs-action image-scan exit
# code reflects that policy's verdict — that is what fails the build.
#
# ONE IMAGE, THREE TARGETS
# ------------------------
# The image is patched ONCE with no platform-specific attribution flags. Every
# falconutil patch-time flag has a documented runtime env-var override ("The
# environment variable overrides the value set by the --X flag"), so each deploy
# job stamps its own attribution via CS_* env vars:
#
#   ACA         -> CS_CLOUD_SERVICE=ACA + CS_AZURE_RESOURCE_GROUP + CS_AZURE_SUBSCRIPTION
#   ACI         -> CS_CLOUD_SERVICE=ACI + CS_AZURE_CONTAINER_GROUP + resource group +
#                  subscription. Docs are explicit that without the ACI value
#                  "these deployments won't be listed under ACI".
#   App Service -> CS_APP_NAME + CS_CONTAINER, and CS_CLOUD_SERVICE deliberately
#                  UNSET (there is no App Service enum; ACA/ACI/ECS_FARGATE/CLOUDRUN
#                  are the only accepted values — stamping ACA here would attribute
#                  the workload to a container app resource that does not exist).
#
# This keeps a single gated artifact: the image that was scanned is byte-for-byte
# the image that is deployed to all three platforms.
#
# SECURITY NOTE: --cid is baked into the patched image at patch time and has no
# runtime override. The patched image is therefore a CID-bearing artifact — the
# staging repo below holds CID-bearing images and should be treated accordingly.

name: Build and Deploy Falcon Container (ACA + ACI + App Service)

on:
  workflow_dispatch:
    inputs:
      demoScenario:
        type: choice
        default: 'clean'
        description: 'Which defect to bake into the image (drives the gate demo)'
        options:
          - 'clean'
          - 'vulnerability'
          - 'malware'
      deployTarget:
        type: choice
        default: 'all'
        description: 'Where to deploy the patched image (only if the gate passes)'
        options:
          - 'none'
          - 'aca'
          - 'appservice'
          - 'aci'
          - 'all'
      runFCSScan:
        type: boolean
        default: true
        description: 'Run Falcon Container Security scan on patched image'
      falconRegion:
        type: choice
        default: 'us-1'
        description: 'CrowdStrike Falcon cloud region'
        options:
          - 'us-1'
          - 'us-2'
          - 'eu-1'
          - 'us-gov-1'
          - 'us-gov-2'
      failOnPolicyViolation:
        type: boolean
        default: true
        description: 'Fail the build if the image-assessment policy denies the image'
  push:
    branches: [main]
  schedule:
    # Daily (not hourly) at an off-minute to avoid the top-of-hour API stampede
    # and keep cost/noise down for a demo repo.
    - cron: '17 2 * * *'

concurrency:
  group: falcon-aca-${{ github.ref }}
  cancel-in-progress: false

permissions:
  id-token: write    # Azure OIDC
  contents: read

env:
  # Unique repo name so the scoped image-assessment policy can't collide with
  # any other image on the shared demo tenant.
  IMAGE_REPO: mikedz-falcon-aca
  # Public known-malware test image (nginx-based; WannaCry/Mirai/XMRig samples).
  MALWARE_SOURCE_IMAGE: quay.io/petr_ruzicka/malware-cryptominer-container:3
  # Logical container name baked in via --container; each deploy job can override
  # it at runtime with CS_CONTAINER.
  FALCON_CONTAINER_NAME: mikedz-falcon-workload

jobs:
  build-scan-and-gate:
    name: Build, Patch, Scan & Gate
    runs-on: ubuntu-latest
    timeout-minutes: 45

    outputs:
      patched-image-ref: ${{ steps.vars.outputs.prod_patched }}
      patched-image-digest: ${{ steps.patch-image.outputs.digest }}
      # NOTE: passed/exit-code are written by the fcs-summary step (it parses the
      # scan JSON), NOT by the fcs-scan action — wiring these to steps.fcs-scan.*
      # silently yields "" and the deploy gate never matches.
      scan-passed: ${{ steps.gate.outputs.passed }}
      scan-exit-code: ${{ steps.fcs-summary.outputs.exit-code }}
      scenario: ${{ steps.vars.outputs.scenario }}
      # Resolved here (not read from inputs.* in the deploy jobs) so that the
      # push/schedule triggers — which have no inputs — still get a real target
      # instead of an empty string that silently matches nothing.
      deploy-target: ${{ steps.vars.outputs.deploy_target }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: CrowdStrike IaC Scan (shift-left, non-blocking)
        uses: crowdstrike/fcs-action@01930f3d7eb5a9ded52e558abf56452f1bc5b46d # v5.0.3
        id: fcs-iac
        continue-on-error: true
        with:
          falcon_client_id: ${{ secrets.FALCON_CLIENT_ID }}
          falcon_region: ${{ inputs.falconRegion || 'us-1' }}
          scan_type: 'iac'
          path: './'
          report_formats: 'json'
          output_path: './scan-iac.json'
          upload_results: true
          no_color: true
        env:
          FALCON_CLIENT_SECRET: ${{ secrets.FALCON_CLIENT_SECRET }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Set image variables
        id: vars
        run: |
          set -euo pipefail

          # Default scenario/target so push & schedule triggers (no inputs) still work.
          SCENARIO="${{ inputs.demoScenario || 'clean' }}"
          TARGET="${{ inputs.deployTarget || 'aca' }}"
          REGISTRY="${{ vars.ACR_NAME }}.azurecr.io"
          TAG=$(echo "$GITHUB_SHA" | cut -c1-8)

          echo "scenario=${SCENARIO}"                                        >> $GITHUB_OUTPUT
          echo "deploy_target=${TARGET}"                                     >> $GITHUB_OUTPUT
          echo "registry=${REGISTRY}"                                        >> $GITHUB_OUTPUT
          echo "tag=${TAG}"                                                  >> $GITHUB_OUTPUT
          echo "base_image=${REGISTRY}/${{ env.IMAGE_REPO }}:${TAG}"         >> $GITHUB_OUTPUT
          # Staging (quarantine) tag: the patched image is published HERE first so
          # Falcon can run full registry assessment (incl. malware cloud detection,
          # which does NOT run on a local-only scan). Promoted to the prod tag only
          # if the gate passes; deleted from staging if it fails.
          echo "staging_patched=${REGISTRY}/${{ env.IMAGE_REPO }}-staging:${TAG}-patched" >> $GITHUB_OUTPUT
          echo "prod_patched=${REGISTRY}/${{ env.IMAGE_REPO }}:${TAG}-patched" >> $GITHUB_OUTPUT
          echo "sensor_image=${REGISTRY}/falcon-container:${TAG}"            >> $GITHUB_OUTPUT

          echo "### 🎬 Demo scenario: \`${SCENARIO}\` — deploy target: \`${TARGET}\`" >> $GITHUB_STEP_SUMMARY

      - name: Azure login via OIDC
        uses: azure/login@7ddb5af1ef8758cf1353cf3b42f940aee27ba21c # v3.0.2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Login to Azure Container Registry
        run: |
          set -euo pipefail
          # az acr login avoids the docker credential-helper conflict entirely.
          az acr login --name ${{ vars.ACR_NAME }}
        timeout-minutes: 2

      - name: Prepare source image (per scenario)
        id: prepare-source
        run: |
          set -euo pipefail
          SCENARIO="${{ steps.vars.outputs.scenario }}"
          BASE_IMAGE="${{ steps.vars.outputs.base_image }}"

          # SECURITY: build/pull the workload image LOCALLY only. It is NOT pushed
          # to ACR here — nothing reaches the registry until it has been patched,
          # scanned, and has PASSED the image-assessment gate (see the push step
          # after the gate). falconutil patches the local image (IfNotPresent).
          if [ "$SCENARIO" = "malware" ]; then
            echo "Pulling known-malware test image: ${MALWARE_SOURCE_IMAGE}"
            docker pull "${MALWARE_SOURCE_IMAGE}"
            docker tag "${MALWARE_SOURCE_IMAGE}" "${BASE_IMAGE}"
          else
            echo "Building scenario '${SCENARIO}' from Dockerfile (local only)..."
            docker build --build-arg "SCENARIO=${SCENARIO}" -t "${BASE_IMAGE}" .
          fi
          echo "Source image staged locally (NOT pushed): ${BASE_IMAGE}"
        timeout-minutes: 10

      - name: Pull Falcon Container Sensor
        id: pull-sensor
        run: |
          set -euo pipefail
          echo "Downloading falcon-container-sensor-pull.sh v1.13.0..."
          curl -fsSL -o falcon-pull.sh \
            "https://github.com/CrowdStrike/falcon-scripts/releases/download/v1.13.0/falcon-container-sensor-pull.sh"
          chmod +x falcon-pull.sh

          SENSOR_OUTPUT=$(./falcon-pull.sh \
            --client-id "${{ secrets.FALCON_CLIENT_ID }}" \
            --client-secret "${{ secrets.FALCON_CLIENT_SECRET }}" \
            --type falcon-container \
            --platform x86_64 \
            --region "${{ inputs.falconRegion || 'us-1' }}")

          SENSOR_IMAGE=$(echo "$SENSOR_OUTPUT" | grep -E "(Downloaded newer image for|Pull complete)" | tail -1 | awk '{print $NF}' || echo "")
          if [ -z "$SENSOR_IMAGE" ]; then
            echo "::error::Failed to extract sensor image reference"; echo "$SENSOR_OUTPUT"; exit 1
          fi
          echo "Sensor image: $SENSOR_IMAGE"

          docker tag "$SENSOR_IMAGE" "${{ steps.vars.outputs.sensor_image }}"
          docker push "${{ steps.vars.outputs.sensor_image }}"
          echo "sensor-ref=${{ steps.vars.outputs.sensor_image }}" >> $GITHUB_OUTPUT

      - name: Patch image with Falcon sensor, publish to STAGING
        id: patch-image
        run: |
          set -euo pipefail
          BASE_IMAGE="${{ steps.vars.outputs.base_image }}"
          SENSOR_IMAGE="${{ steps.vars.outputs.sensor_image }}"
          TARGET_IMAGE="${{ steps.vars.outputs.staging_patched }}"

          echo "Patching ${BASE_IMAGE} with sensor ${SENSOR_IMAGE} -> ${TARGET_IMAGE} (staging)..."
          # Platform-AGNOSTIC patch: no --cloud-service / --resource-group /
          # --subscription here. Those are ACA-specific ("This flag is specific to
          # Azure Container Apps") and each has a runtime CS_* override, so the
          # deploy jobs stamp attribution per target. One image serves both.
          #
          # falconutil sets /opt/CrowdStrike/rootfs/bin/falcon-entrypoint as the
          # image ENTRYPOINT and chains to the original entrypoint after starting
          # the sensor. The sensor runs through its own dynamic loader with its own
          # libc under /opt/CrowdStrike/rootfs/lib64, so the base image's libc is
          # irrelevant.
          PATCH_OUTPUT=$(docker run --user 0:0 \
            -v /var/run/docker.sock:/var/run/docker.sock \
            --rm "${SENSOR_IMAGE}" \
            falconutil patch-image \
            --source-image-uri "${BASE_IMAGE}" \
            --target-image-uri "${TARGET_IMAGE}" \
            --falcon-image-uri "${SENSOR_IMAGE}" \
            --image-pull-policy IfNotPresent \
            --container "${{ env.FALCON_CONTAINER_NAME }}" \
            --cid "${{ secrets.FALCON_CID }}")
          echo "$PATCH_OUTPUT"

          # Publish the patched image to the STAGING repo so Falcon can run a full
          # registry assessment (malware cloud detection does not run on a local-only
          # scan). This is a quarantine location — the deployable repo is untouched
          # until the gate passes and we promote.
          echo "Publishing patched image to staging: ${TARGET_IMAGE}"
          docker push "${TARGET_IMAGE}"

          PATCHED_DIGEST=$(echo "$PATCH_OUTPUT" | grep -E "writing image" | awk '{print $4}' || echo "")
          if [ -z "$PATCHED_DIGEST" ]; then
            echo "::warning::Could not parse digest from patch output; resolving from ACR..."
            PATCHED_DIGEST=$(az acr manifest show --name "${TARGET_IMAGE#*/}" --registry ${{ vars.ACR_NAME }} --query digest -o tsv)
          fi
          echo "digest=${PATCHED_DIGEST}" >> $GITHUB_OUTPUT
          echo "ref=${TARGET_IMAGE}" >> $GITHUB_OUTPUT

      - name: CrowdStrike Image Scan (policy gate)
        uses: crowdstrike/fcs-action@01930f3d7eb5a9ded52e558abf56452f1bc5b46d # v5.0.3
        id: fcs-scan
        if: ${{ inputs.runFCSScan == null || inputs.runFCSScan }}
        # Scans the patched image in the STAGING repo (registry assessment). A local
        # (socket) scan returns vulnerabilities/CIS/misconfig but NOT Falcon malware
        # cloud detection — verified on both v2.0.2 and v5.0.3 — so the image must be
        # in a registry for the gate to catch malware. Staging is a quarantine repo;
        # the deployable repo is untouched until we promote on pass.
        # For image scans the exit code reflects the Falcon console image-assessment
        # POLICY verdict; the explicit gate steps below act on it.
        with:
          falcon_client_id: ${{ secrets.FALCON_CLIENT_ID }}
          falcon_region: ${{ inputs.falconRegion || 'us-1' }}
          scan_type: 'image'
          image: ${{ steps.patch-image.outputs.ref }}
          minimum_exprt: 'critical'
          report_formats: 'json'
          output_path: './scan-image.json'
          upload_results: true
          no_color: true
        env:
          FALCON_CLIENT_SECRET: ${{ secrets.FALCON_CLIENT_SECRET }}

      - name: Render FCS scan results & publish summary
        if: always()
        id: fcs-summary
        env:
          IMAGE: ${{ steps.patch-image.outputs.ref }}
          GATE_EXIT: ${{ steps.fcs-scan.outputs.exit-code }}
          SCENARIO: ${{ steps.vars.outputs.scenario }}
        run: |
          set +e
          SUMMARY=fcs-summary.md
          : > "$SUMMARY"

          if [ "${GATE_EXIT:-0}" != "0" ]; then
            echo "## ❌ Image blocked by Falcon image-assessment policy" >> "$SUMMARY"
          else
            echo "## ✅ Falcon image-assessment passed" >> "$SUMMARY"
          fi
          echo "" >> "$SUMMARY"
          SHORT_SHA=$(printf '%.8s' "$GITHUB_SHA")
          echo "**Scenario:** \`${SCENARIO}\` &nbsp;|&nbsp; **Image:** \`${IMAGE}\` &nbsp;|&nbsp; **Commit:** \`${SHORT_SHA}\` &nbsp;|&nbsp; **Gate exit:** \`${GATE_EXIT}\`" >> "$SUMMARY"
          echo "" >> "$SUMMARY"

          if [ -f scan-image.json ]; then
            echo "### Container Image Assessment (blocking)" >> "$SUMMARY"; echo "" >> "$SUMMARY"
            CRIT=$(jq -r '.VulnerabilitiesSummary.severities.critical // 0' scan-image.json 2>/dev/null || echo 0)
            HIGH=$(jq -r '.VulnerabilitiesSummary.severities.high // 0' scan-image.json 2>/dev/null || echo 0)
            TOTAL=$(jq -r '.VulnerabilitiesSummary.count // 0' scan-image.json 2>/dev/null || echo 0)
            POLICY_NAME=$(jq -r '.PolicyResponse.policy.name // "N/A"' scan-image.json 2>/dev/null || echo "N/A")
            POLICY_DENY=$(jq -r '.PolicyResponse.deny // false' scan-image.json 2>/dev/null || echo false)
            echo "| Critical | High | Total |" >> "$SUMMARY"
            echo "|----------|------|-------|" >> "$SUMMARY"
            echo "| $CRIT | $HIGH | $TOTAL |" >> "$SUMMARY"
            echo "" >> "$SUMMARY"
            echo "**Policy:** $POLICY_NAME &nbsp;|&nbsp; **Denied:** \`$POLICY_DENY\`" >> "$SUMMARY"
            echo "" >> "$SUMMARY"
          fi

          cat "$SUMMARY" >> "$GITHUB_STEP_SUMMARY"
          echo "passed=$([ "${GATE_EXIT:-0}" = "0" ] && echo "true" || echo "false")" >> $GITHUB_OUTPUT
          echo "exit-code=${GATE_EXIT:-0}" >> $GITHUB_OUTPUT
          true

      - name: Upload scan reports
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: falcon-scan-reports-${{ github.sha }}
          path: |
            scan-iac.json
            scan-image.json
            fcs-summary.md
          retention-days: 30

      - name: Evaluate gate (image-assessment policy)
        id: gate
        run: |
          set -euo pipefail
          IMG_EXIT="${{ steps.fcs-summary.outputs.exit-code }}"
          # The image-assessment policy verdict (vulnerability / malware) drives the
          # gate. exit 0 = passed; non-zero = denied. The IaC scan above is
          # shift-left visibility only and deliberately does NOT gate.
          if [ "${IMG_EXIT:-0}" = "0" ]; then
            echo "passed=true" >> $GITHUB_OUTPUT
            echo "reason=image-assessment policy passed (exit 0)" >> $GITHUB_OUTPUT
            echo "Gate PASSED (image-assessment exit ${IMG_EXIT:-0})"
          else
            echo "passed=false" >> $GITHUB_OUTPUT
            echo "reason=image-assessment policy denied (exit ${IMG_EXIT})" >> $GITHUB_OUTPUT
            echo "Gate DENIED (image-assessment exit ${IMG_EXIT})"
          fi

      - name: Gate BLOCKED — delete staging image, fail build
        # On gate denial the quarantined image is removed from staging and the
        # build fails. It is NEVER promoted.
        if: ${{ steps.gate.outputs.passed == 'false' }}
        run: |
          set -euo pipefail
          STAGING="${{ steps.vars.outputs.staging_patched }}"
          IMG="${STAGING#*/}"
          echo "Gate denied (${{ steps.gate.outputs.reason }}) — deleting quarantined image ${IMG}..."
          az acr repository delete --name ${{ vars.ACR_NAME }} --image "${IMG}" --yes 2>/dev/null || echo "(nothing to delete)"
          if [ "${{ inputs.failOnPolicyViolation }}" = "true" ]; then
            echo "::error::Image-assessment policy denied this image (exit ${{ steps.fcs-summary.outputs.exit-code }}, scenario='${{ steps.vars.outputs.scenario }}'). Quarantine deleted; nothing promoted. Remediate (or run scenario=clean) to clear the gate."
            exit 1
          fi
          echo "::warning::Gate denied but failOnPolicyViolation=false; not failing. Image was NOT promoted."

      - name: Gate PASSED — promote staging → deployable repo
        # Only a passed image is promoted to the deployable repo/tag. Staging is
        # then cleaned up. The deployable repo only ever holds gated images.
        # Retag+push preserves the manifest digest, so the image deployed below is
        # byte-for-byte the image that was scanned.
        if: ${{ steps.gate.outputs.passed == 'true' }}
        run: |
          set -euo pipefail
          STAGING="${{ steps.vars.outputs.staging_patched }}"
          PROD="${{ steps.vars.outputs.prod_patched }}"
          echo "Gate passed — promoting ${STAGING} -> ${PROD}"
          docker tag "${STAGING}" "${PROD}"
          docker push "${PROD}"
          echo "Promoted to deployable repo: ${PROD}"
          echo "Cleaning up staging tag..."
          az acr repository delete --name ${{ vars.ACR_NAME }} --image "${STAGING#*/}" --yes 2>/dev/null || echo "(staging already gone)"

  # ---------------------------------------------------------------------------
  # Deploy: Azure Container Apps
  # ---------------------------------------------------------------------------
  deploy-aca:
    name: Deploy to Azure Container Apps
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build-scan-and-gate
    if: >-
      ${{ needs.build-scan-and-gate.outputs.scan-passed == 'true' &&
          (needs.build-scan-and-gate.outputs.deploy-target == 'aca' ||
           needs.build-scan-and-gate.outputs.deploy-target == 'all') }}
    environment: production

    steps:
      - name: Azure login via OIDC
        uses: azure/login@7ddb5af1ef8758cf1353cf3b42f940aee27ba21c # v3.0.2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Ensure Container Apps environment exists
        id: ensure-environment
        run: |
          set -euo pipefail
          RG="${{ vars.RESOURCE_GROUP }}"; ENV_NAME="${{ vars.ACA_ENV_NAME }}"; LOCATION="${{ vars.AZURE_LOCATION }}"
          if az containerapp env show --name "${ENV_NAME}" --resource-group "${RG}" --query "name" -o tsv 2>/dev/null; then
            echo "Environment '${ENV_NAME}' already exists"; echo "status=exists" >> $GITHUB_OUTPUT
          else
            echo "Creating environment '${ENV_NAME}'..."
            az containerapp env create --name "${ENV_NAME}" --resource-group "${RG}" --location "${LOCATION}" --logs-destination none --output table
            echo "status=created" >> $GITHUB_OUTPUT
          fi

      - name: Deploy to Azure Container Apps
        id: deploy
        # Deploy via az CLI (not the action) so we can configure ACR pull through
        # our user-assigned managed identity — ACR admin is disabled, so the app
        # must authenticate to the registry with an identity that has AcrPull.
        # Our OIDC identity (AZURE_CLIENT_ID) already holds AcrPush (which includes
        # pull), so we attach it to the app and point the registry at it.
        run: |
          set -euo pipefail
          RG="${{ vars.RESOURCE_GROUP }}"
          APP="${{ vars.CONTAINER_APP_NAME }}"
          ENV="${{ vars.ACA_ENV_NAME }}"
          ACR_SERVER="${{ vars.ACR_NAME }}.azurecr.io"
          IMAGE="${{ needs.build-scan-and-gate.outputs.patched-image-ref }}"

          # ACA attribution, applied at RUNTIME (the image itself was patched
          # platform-agnostically). These override the equivalent patch-time flags.
          CS_ENV="CS_CLOUD_SERVICE=ACA \
            CS_AZURE_RESOURCE_GROUP=${RG} \
            CS_AZURE_SUBSCRIPTION=${{ vars.AZURE_SUBSCRIPTION_ID }} \
            CS_CONTAINER=${APP}"

          UAMI_ID=$(az identity list -g "$RG" \
            --query "[?clientId=='${{ vars.AZURE_CLIENT_ID }}'].id | [0]" -o tsv)
          if [ -z "$UAMI_ID" ]; then
            echo "::error::Could not resolve user-assigned identity (clientId=${{ vars.AZURE_CLIENT_ID }}) in ${RG}"; exit 1
          fi
          echo "Using managed identity: $UAMI_ID"

          # If the app exists but is stuck in a Failed provisioning state (e.g. a
          # prior broken create), delete it so we can recreate cleanly — update
          # can't recover a Failed app.
          STATE=$(az containerapp show -n "$APP" -g "$RG" --query "properties.provisioningState" -o tsv 2>/dev/null || echo "NotFound")
          echo "Current provisioning state: ${STATE}"
          if [ "$STATE" = "Failed" ]; then
            echo "App is in Failed state — deleting before recreate..."
            az containerapp delete -n "$APP" -g "$RG" --yes -o none
            STATE="NotFound"
          fi

          if [ "$STATE" != "NotFound" ] && az containerapp show -n "$APP" -g "$RG" >/dev/null 2>&1; then
            echo "Updating existing Container App ${APP}..."
            az containerapp registry set -n "$APP" -g "$RG" \
              --server "$ACR_SERVER" --identity "$UAMI_ID" -o none
            az containerapp update -n "$APP" -g "$RG" --image "$IMAGE" \
              --set-env-vars $CS_ENV -o none
          else
            echo "Creating Container App ${APP}..."
            # NOTE: do NOT pass --command here. On ACA --command IS an --entrypoint
            # override and would replace falcon-entrypoint, silently disabling the
            # sensor. If a command is ever required, prepend
            # /opt/CrowdStrike/rootfs/bin/falcon-entrypoint to it.
            az containerapp create -n "$APP" -g "$RG" \
              --environment "$ENV" \
              --image "$IMAGE" \
              --target-port 80 --ingress external \
              --min-replicas 1 --max-replicas 1 \
              --user-assigned "$UAMI_ID" \
              --registry-server "$ACR_SERVER" --registry-identity "$UAMI_ID" \
              --env-vars $CS_ENV \
              -o none
          fi

          FQDN=$(az containerapp show -n "$APP" -g "$RG" --query properties.configuration.ingress.fqdn -o tsv)
          echo "fqdn=${FQDN}" >> $GITHUB_OUTPUT
          echo "Deployed. App URL: https://${FQDN}"

      - name: Verify app responds
        run: |
          set -euo pipefail
          FQDN="${{ steps.deploy.outputs.fqdn }}"
          echo "Probing https://${FQDN}/health ..."
          for i in $(seq 1 30); do
            CODE=$(curl -fsS -o /dev/null -w '%{http_code}' --max-time 10 "https://${FQDN}/health" 2>/dev/null || echo "000")
            if [ "$CODE" = "200" ]; then
              echo "App responded 200 after $((i*10))s — falcon-entrypoint chained to the app successfully."
              exit 0
            fi
            echo "  attempt ${i}: HTTP ${CODE}; retrying in 10s..."
            sleep 10
          done
          echo "::error::App did not return 200 within 300s. If the container is crash-looping, check whether the sensor failed closed."
          exit 1

      - name: Deployment summary
        run: |
          echo "## 🚀 ACA Deployment Complete" >> $GITHUB_STEP_SUMMARY
          echo "- **Scenario:** ${{ needs.build-scan-and-gate.outputs.scenario }} (passed the gate)" >> $GITHUB_STEP_SUMMARY
          echo "- **Image:** \`${{ needs.build-scan-and-gate.outputs.patched-image-ref }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Container App:** ${{ vars.CONTAINER_APP_NAME }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Environment:** ${{ vars.ACA_ENV_NAME }} (${{ steps.ensure-environment.outputs.status }})" >> $GITHUB_STEP_SUMMARY
          echo "- **Attribution:** \`CS_CLOUD_SERVICE=ACA\` (runtime)" >> $GITHUB_STEP_SUMMARY
          echo "- **URL:** https://${{ steps.deploy.outputs.fqdn }}" >> $GITHUB_STEP_SUMMARY

  # ---------------------------------------------------------------------------
  # Deploy: Azure App Service (Web App for Containers, Linux)
  # ---------------------------------------------------------------------------
  # App Service is NOT one of the four platforms with a tailored CrowdStrike
  # deployment guide (ACA / ACI / ECS_FARGATE / CLOUDRUN). It uses the generic
  # "Falcon Container Sensor embedded in a container image" path, which CrowdStrike
  # documents for "other environments that support deployments based on container
  # images" — with the documented tradeoff that tailored deployments "provide more
  # container visibility in the Falcon console than this more generic method."
  #
  # Why the patched image survives here:
  #   * App Service APPENDS the Startup Command as the [COMMAND] [ARG...] segment —
  #     it replaces CMD, not ENTRYPOINT. falcon-entrypoint still runs. (Unlike ACA,
  #     whose --command genuinely overrides the entrypoint.) We set no startup
  #     command at all, so the chain is untouched.
  #   * The sensor ships in /opt via an image layer, and WEBSITES_ENABLE_APP_SERVICE_STORAGE
  #     only overlays /home — /opt is never masked.
  #   * You get root in the container and background daemons are supported, which is
  #     exactly what falcon-entrypoint needs.
  #   * SYS_PTRACE is required by the ORCHESTRATOR-INJECTION paths (the Fargate
  #     task-definition patcher, OpenShift SCC), not by patch-image. Cloud Run uses
  #     patch-image exclusively and also forbids adding capabilities.
  # ---------------------------------------------------------------------------
  deploy-appservice:
    name: Deploy to Azure App Service
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: build-scan-and-gate
    if: >-
      ${{ needs.build-scan-and-gate.outputs.scan-passed == 'true' &&
          (needs.build-scan-and-gate.outputs.deploy-target == 'appservice' ||
           needs.build-scan-and-gate.outputs.deploy-target == 'all') }}
    environment: production

    steps:
      - name: Azure login via OIDC
        uses: azure/login@7ddb5af1ef8758cf1353cf3b42f940aee27ba21c # v3.0.2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Enable ACR ARM-audience authentication
        # Required for managed-identity pulls. Without this, App Service pulls fail
        # with: UNAUTHORIZED "token validation failed". Idempotent.
        run: |
          set -euo pipefail
          az acr config authentication-as-arm update \
            --registry ${{ vars.ACR_NAME }} --status enabled -o none
          echo "ACR ARM-audience auth enabled on ${{ vars.ACR_NAME }}"

      - name: Ensure Linux App Service plan exists
        id: ensure-plan
        run: |
          set -euo pipefail
          RG="${{ vars.RESOURCE_GROUP }}"
          PLAN="${{ vars.APP_SERVICE_PLAN }}"
          LOCATION="${{ vars.AZURE_LOCATION }}"
          if az appservice plan show -n "$PLAN" -g "$RG" --query name -o tsv 2>/dev/null; then
            echo "Plan '${PLAN}' already exists"; echo "status=exists" >> $GITHUB_OUTPUT
          else
            echo "Creating Linux plan '${PLAN}' (B1)..."
            az appservice plan create -n "$PLAN" -g "$RG" --location "$LOCATION" \
              --is-linux --sku B1 -o none
            echo "status=created" >> $GITHUB_OUTPUT
          fi

      - name: Deploy to Azure App Service
        id: deploy
        run: |
          set -euo pipefail
          RG="${{ vars.RESOURCE_GROUP }}"
          APP="${{ vars.APP_SERVICE_NAME }}"
          PLAN="${{ vars.APP_SERVICE_PLAN }}"
          ACR_SERVER="${{ vars.ACR_NAME }}.azurecr.io"
          IMAGE="${{ needs.build-scan-and-gate.outputs.patched-image-ref }}"
          CLIENT_ID="${{ vars.AZURE_CLIENT_ID }}"

          UAMI_ID=$(az identity list -g "$RG" \
            --query "[?clientId=='${CLIENT_ID}'].id | [0]" -o tsv)
          if [ -z "$UAMI_ID" ]; then
            echo "::error::Could not resolve user-assigned identity (clientId=${CLIENT_ID}) in ${RG}"; exit 1
          fi
          echo "Using managed identity: $UAMI_ID"

          if az webapp show -n "$APP" -g "$RG" >/dev/null 2>&1; then
            echo "Web app ${APP} exists — updating container image..."
          else
            echo "Creating web app ${APP}..."
            az webapp create -n "$APP" -g "$RG" --plan "$PLAN" \
              --container-image-name "$IMAGE" -o none
          fi

          # Point at the gated image. NOTE: no --startup-file is set anywhere. On
          # App Service the startup command is appended as CMD (it does not replace
          # ENTRYPOINT), but leaving it empty keeps the falcon-entrypoint -> app
          # chain exactly as falconutil built it.
          az webapp config container set -n "$APP" -g "$RG" \
            --container-image-name "$IMAGE" \
            --container-registry-url "https://${ACR_SERVER}" -o none

          # Attach the user-assigned identity and point ACR pull at it.
          az webapp identity assign -n "$APP" -g "$RG" --identities "$UAMI_ID" -o none

          # `az webapp config set --generic-configurations` does NOT reliably persist
          # acrUserManagedIdentityID (it silently stayed null on the first run, and the
          # pull fell back to admin creds). Patch config/web directly instead.
          az resource update \
            --resource-group "$RG" \
            --namespace Microsoft.Web \
            --parent "sites/${APP}" \
            --resource-type config \
            --name web \
            --set "properties.acrUseManagedIdentityCreds=true" \
                  "properties.acrUserManagedIdentityID=${CLIENT_ID}" -o none

          # `az webapp config container set` auto-populates DOCKER_REGISTRY_SERVER_*
          # from the registry's admin user when it is enabled. Those settings take
          # precedence over managed identity, so the MI path is never exercised and a
          # broken MI config passes unnoticed. Remove them so the pull MUST use the
          # identity — if the identity is misconfigured we want a hard failure, not a
          # silent fallback.
          EXISTING=$(az webapp config appsettings list -n "$APP" -g "$RG" \
            --query "[?starts_with(name,'DOCKER_REGISTRY_SERVER_')].name" -o tsv)
          if [ -n "$EXISTING" ]; then
            echo "Removing admin-credential fallback settings: $(echo $EXISTING | tr '\n' ' ')"
            az webapp config appsettings delete -n "$APP" -g "$RG" \
              --setting-names $EXISTING -o none
          fi

          # App settings become container env vars.
          #   WEBSITES_PORT ................ port App Service HTTP-pings and routes to
          #   WEBSITES_CONTAINER_START_TIME_LIMIT ... default is 230s; the sensor adds
          #     startup latency before the app binds, so raise it (max 1800)
          #   CS_APP_NAME / CS_CONTAINER ... platform-agnostic Falcon attribution
          # CS_CLOUD_SERVICE is deliberately NOT set: there is no App Service enum,
          # and stamping ACA would attribute this to a nonexistent container app.
          az webapp config appsettings set -n "$APP" -g "$RG" --settings \
            WEBSITES_PORT=80 \
            WEBSITES_CONTAINER_START_TIME_LIMIT=600 \
            WEBSITES_ENABLE_APP_SERVICE_STORAGE=false \
            CS_APP_NAME="falcon-appservice-demo" \
            CS_CONTAINER="${APP}" \
            -o none

          az webapp restart -n "$APP" -g "$RG" -o none

          FQDN=$(az webapp show -n "$APP" -g "$RG" --query defaultHostName -o tsv)
          echo "fqdn=${FQDN}" >> $GITHUB_OUTPUT
          echo "Deployed. App URL: https://${FQDN}"

      - name: Verify app responds (sensor did not fail closed)
        id: probe
        # This is the load-bearing test. App Service health-pings the container and
        # restart-loops it if nothing binds the port. A 200 here proves
        # falcon-entrypoint started the sensor AND chained to the app — i.e. the
        # sensor did not fail closed inside the App Service sandbox.
        run: |
          set -euo pipefail
          FQDN="${{ steps.deploy.outputs.fqdn }}"
          echo "Probing https://${FQDN}/health ..."
          for i in $(seq 1 45); do
            CODE=$(curl -fsS -o /dev/null -w '%{http_code}' --max-time 10 "https://${FQDN}/health" 2>/dev/null || echo "000")
            if [ "$CODE" = "200" ]; then
              echo "App responded 200 after $((i*10))s."
              echo "result=pass" >> $GITHUB_OUTPUT
              exit 0
            fi
            echo "  attempt ${i}: HTTP ${CODE}; retrying in 10s..."
            sleep 10
          done
          echo "result=fail" >> $GITHUB_OUTPUT
          echo "::error::App did not return 200 within 450s. Pull the container logs below to see whether falcon-entrypoint or the app is at fault."
          exit 1

      - name: Container logs (sensor startup evidence)
        if: always()
        continue-on-error: true
        # Docker/container logs include the entrypoint chain, so this is where
        # falcon-entrypoint output and any sensor startup failure will surface.
        run: |
          set +e
          RG="${{ vars.RESOURCE_GROUP }}"; APP="${{ vars.APP_SERVICE_NAME }}"
          echo "Downloading container logs for ${APP}..."
          az webapp log download -n "$APP" -g "$RG" --log-file appservice-logs.zip 2>/dev/null
          if [ -f appservice-logs.zip ]; then
            mkdir -p appservice-logs && unzip -o -q appservice-logs.zip -d appservice-logs
            echo "--- lines mentioning falcon / CrowdStrike / entrypoint ---"
            grep -rhiE "falcon|crowdstrike|entrypoint" appservice-logs | tail -50
          else
            echo "(no logs retrieved; enable logging with: az webapp log config -n $APP -g $RG --docker-container-logging filesystem)"
          fi
          true

      - name: Verify Falcon sensor got an AID (best effort)
        if: always()
        continue-on-error: true
        # Documented verification is `falconctl -g --aid` inside the container, but on
        # Linux App Service there is no reliable way to reach it from CI:
        #   * Kudu runs as a SEPARATE sidecar container, so /api/command execs there —
        #     it cannot see /opt/CrowdStrike in the app container at all.
        #   * SCM basic auth is commonly disabled (allow=false), which makes the Kudu
        #     REST calls below return empty regardless.
        # So treat any failure here as INCONCLUSIVE, never as a sensor failure. The
        # ACI job below is the target that can actually prove the AID (az container
        # exec works there); use it as the sensor-registration canary for this image.
        #
        # CAUTION: the sensor self-defends by terminating processes that read its
        # /proc entries, and the documented opt-out is a Kubernetes annotation with
        # no embedded-mode equivalent. Prefer falconctl over `ps`-style enumeration.
        run: |
          set +e
          RG="${{ vars.RESOURCE_GROUP }}"; APP="${{ vars.APP_SERVICE_NAME }}"
          ALLOW=$(az resource show \
            --ids "/subscriptions/${{ vars.AZURE_SUBSCRIPTION_ID }}/resourceGroups/${RG}/providers/Microsoft.Web/sites/${APP}/basicPublishingCredentialsPolicies/scm" \
            --query "properties.allow" -o tsv 2>/dev/null)
          echo "SCM basic auth allowed: ${ALLOW:-unknown}"
          if [ "$ALLOW" != "true" ]; then
            echo "::notice::SCM basic auth is disabled, so the Kudu AID probe cannot run. This is expected and is NOT a sensor failure — see the ACI job for authoritative AID verification."
            exit 0
          fi
          CREDS=$(az webapp deployment list-publishing-credentials -n "$APP" -g "$RG" \
            --query "{u:publishingUserName,p:publishingPassword}" -o json 2>/dev/null)
          USER=$(echo "$CREDS" | jq -r .u); PASS=$(echo "$CREDS" | jq -r .p)
          RESP=$(curl -sS -u "$USER:$PASS" -X POST \
            -H 'Content-Type: application/json' \
            --max-time 60 \
            -d '{"command":"/opt/CrowdStrike/rootfs/bin/falconctl -g --aid","dir":"/"}' \
            "https://${APP}.scm.azurewebsites.net/api/command" 2>/dev/null)
          echo "Kudu response: ${RESP}"
          if echo "$RESP" | grep -qiE "aid=?[0-9a-f]{32}"; then
            echo "✅ Sensor reported an AID — it registered with the CrowdStrike cloud."
          else
            echo "::notice::No AID parsed — inconclusive (Kudu is a sidecar container and cannot see the app container's filesystem). Verify in the Falcon console, or rely on the ACI job."
          fi
          true

      - name: Deployment summary
        if: always()
        run: |
          echo "## 🚀 App Service Deployment" >> $GITHUB_STEP_SUMMARY
          echo "- **Scenario:** ${{ needs.build-scan-and-gate.outputs.scenario }} (passed the gate)" >> $GITHUB_STEP_SUMMARY
          echo "- **Image:** \`${{ needs.build-scan-and-gate.outputs.patched-image-ref }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Web App:** ${{ vars.APP_SERVICE_NAME }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Plan:** ${{ vars.APP_SERVICE_PLAN }} (${{ steps.ensure-plan.outputs.status }})" >> $GITHUB_STEP_SUMMARY
          echo "- **HTTP probe:** ${{ steps.probe.outputs.result || 'fail' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Attribution:** \`CS_APP_NAME\` + \`CS_CONTAINER\` (generic embedded path; \`CS_CLOUD_SERVICE\` intentionally unset)" >> $GITHUB_STEP_SUMMARY
          echo "- **URL:** https://${{ steps.deploy.outputs.fqdn }}" >> $GITHUB_STEP_SUMMARY

  # ---------------------------------------------------------------------------
  # Deploy: Azure Container Instances
  # ---------------------------------------------------------------------------
  # ACI has a tailored CrowdStrike deployment guide, so unlike App Service it gets
  # full console attribution. Differences from the ACA path:
  #   * CS_AZURE_CONTAINER_GROUP is ACI-specific (no ACA equivalent).
  #   * The optional metadata-enrichment API call needs only `Reader` at resource
  #     group scope, not ACA's `ContainerApp Reader`. Our identity already holds
  #     Contributor on the RG, which covers it.
  #   * ACI Linux exposes the real IMDS endpoint (169.254.169.254), whereas ACA and
  #     App Service expose IDENTITY_ENDPOINT/IDENTITY_HEADER instead.
  #   * ACR pull by managed identity requires passing the SAME user-assigned identity
  #     to BOTH --assign-identity and --acr-identity. ACI does NOT support
  #     system-assigned identities for ACR pulls at all.
  #   * --command-line would override the falcon-entrypoint, same trap as ACA's
  #     --command. We do not pass it.
  #
  # This job is also the sensor-registration CANARY for the whole pipeline: ACI is
  # the only one of the three targets where `az container exec` and `az container
  # logs` both work, so it is the one place CI can actually prove the sensor got an
  # AID. The image is identical across all three targets, so an AID here is strong
  # evidence the sensor is healthy in the shared artifact.
  # ---------------------------------------------------------------------------
  deploy-aci:
    name: Deploy to Azure Container Instances
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: build-scan-and-gate
    if: >-
      ${{ needs.build-scan-and-gate.outputs.scan-passed == 'true' &&
          (needs.build-scan-and-gate.outputs.deploy-target == 'aci' ||
           needs.build-scan-and-gate.outputs.deploy-target == 'all') }}
    environment: production

    steps:
      - name: Azure login via OIDC
        uses: azure/login@7ddb5af1ef8758cf1353cf3b42f940aee27ba21c # v3.0.2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy container group to ACI
        id: deploy
        run: |
          set -euo pipefail
          RG="${{ vars.RESOURCE_GROUP }}"
          CG="${{ vars.ACI_NAME }}"
          DNS="${{ vars.ACI_DNS_LABEL }}"
          LOCATION="${{ vars.AZURE_LOCATION }}"
          ACR_SERVER="${{ vars.ACR_NAME }}.azurecr.io"
          IMAGE="${{ needs.build-scan-and-gate.outputs.patched-image-ref }}"
          CLIENT_ID="${{ vars.AZURE_CLIENT_ID }}"

          UAMI_ID=$(az identity list -g "$RG" \
            --query "[?clientId=='${CLIENT_ID}'].id | [0]" -o tsv)
          if [ -z "$UAMI_ID" ]; then
            echo "::error::Could not resolve user-assigned identity (clientId=${CLIENT_ID}) in ${RG}"; exit 1
          fi
          echo "Using managed identity: $UAMI_ID"

          # ACI container groups are effectively immutable — you cannot swap the image
          # on a running group. Delete and recreate for a deterministic deploy.
          if az container show -n "$CG" -g "$RG" >/dev/null 2>&1; then
            echo "Deleting existing container group ${CG}..."
            az container delete -n "$CG" -g "$RG" --yes -o none
          fi

          echo "Creating container group ${CG}..."
          # NOTE: no --registry-username/--registry-password. Pull is via the managed
          # identity, which is why the same identity goes to --acr-identity and
          # --assign-identity. If the identity lacks AcrPull this FAILS LOUDLY rather
          # than silently falling back to admin credentials.
          az container create -n "$CG" -g "$RG" \
            --location "$LOCATION" \
            --image "$IMAGE" \
            --os-type Linux \
            --cpu 1 --memory 1.5 \
            --ports 80 \
            --dns-name-label "$DNS" \
            --restart-policy OnFailure \
            --assign-identity "$UAMI_ID" \
            --acr-identity "$UAMI_ID" \
            --environment-variables \
              CS_CLOUD_SERVICE=ACI \
              CS_AZURE_CONTAINER_GROUP="$CG" \
              CS_AZURE_RESOURCE_GROUP="$RG" \
              CS_AZURE_SUBSCRIPTION="${{ vars.AZURE_SUBSCRIPTION_ID }}" \
              CS_CONTAINER="$CG" \
              CS_APP_NAME="falcon-aci-demo" \
            -o none

          FQDN=$(az container show -n "$CG" -g "$RG" --query ipAddress.fqdn -o tsv)
          STATE=$(az container show -n "$CG" -g "$RG" --query instanceView.state -o tsv)
          echo "fqdn=${FQDN}" >> $GITHUB_OUTPUT
          echo "Container group state: ${STATE}; FQDN: ${FQDN}"

      - name: Confirm image was pulled via managed identity
        # Proves the MI pull path actually ran. A Pulled event with no admin
        # credentials configured on the group is the evidence we want.
        run: |
          set -euo pipefail
          RG="${{ vars.RESOURCE_GROUP }}"; CG="${{ vars.ACI_NAME }}"
          echo "=== imageRegistryCredentials (should show identity, NOT a username) ==="
          az container show -n "$CG" -g "$RG" \
            --query "imageRegistryCredentials" -o json
          echo "=== container events ==="
          az container show -n "$CG" -g "$RG" \
            --query "containers[].instanceView.events[].{t:type,name:name,msg:message}" -o table

      - name: Verify app responds (sensor did not fail closed)
        id: probe
        run: |
          set -euo pipefail
          FQDN="${{ steps.deploy.outputs.fqdn }}"
          echo "Probing http://${FQDN}/health ..."
          for i in $(seq 1 30); do
            CODE=$(curl -fsS -o /dev/null -w '%{http_code}' --max-time 10 "http://${FQDN}/health" 2>/dev/null || echo "000")
            if [ "$CODE" = "200" ]; then
              echo "App responded 200 after $((i*10))s."
              echo "result=pass" >> $GITHUB_OUTPUT
              exit 0
            fi
            echo "  attempt ${i}: HTTP ${CODE}; retrying in 10s..."
            sleep 10
          done
          echo "result=fail" >> $GITHUB_OUTPUT
          echo "::error::App did not return 200 within 300s."
          exit 1

      - name: Container logs (sensor startup evidence)
        if: always()
        continue-on-error: true
        run: |
          set +e
          RG="${{ vars.RESOURCE_GROUP }}"; CG="${{ vars.ACI_NAME }}"
          echo "=== full container log ==="
          az container logs -n "$CG" -g "$RG" 2>&1 | tail -60
          true

      - name: Verify Falcon sensor got an AID (authoritative)
        id: aid
        if: always()
        continue-on-error: true
        # ACI supports az container exec, so unlike App Service this is a real check
        # rather than a best-effort one. We still mark it continue-on-error because
        # exec can fail for TTY reasons in CI — but if it returns an AID, that is
        # conclusive proof the sensor registered with the CrowdStrike cloud.
        #
        # We deliberately use falconctl rather than `ps`: the sensor terminates
        # processes that read its /proc entries.
        run: |
          set +e
          RG="${{ vars.RESOURCE_GROUP }}"; CG="${{ vars.ACI_NAME }}"
          OUT=$(az container exec -n "$CG" -g "$RG" \
            --exec-command "/opt/CrowdStrike/rootfs/bin/falconctl -g --aid" 2>&1)
          echo "$OUT"
          AID=$(echo "$OUT" | grep -oiE "[0-9a-f]{32}" | head -1)
          if [ -n "$AID" ]; then
            echo "✅ Sensor registered. AID=${AID}"
            echo "aid=${AID}" >> $GITHUB_OUTPUT
            echo "result=confirmed" >> $GITHUB_OUTPUT
          else
            echo "::warning::No AID returned. Could be exec/TTY limitations in CI rather than a sensor problem — check the container logs above and the Falcon console."
            echo "result=inconclusive" >> $GITHUB_OUTPUT
          fi
          true

      - name: Deployment summary
        if: always()
        run: |
          echo "## 🚀 ACI Deployment" >> $GITHUB_STEP_SUMMARY
          echo "- **Scenario:** ${{ needs.build-scan-and-gate.outputs.scenario }} (passed the gate)" >> $GITHUB_STEP_SUMMARY
          echo "- **Image:** \`${{ needs.build-scan-and-gate.outputs.patched-image-ref }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Container group:** ${{ vars.ACI_NAME }}" >> $GITHUB_STEP_SUMMARY
          echo "- **HTTP probe:** ${{ steps.probe.outputs.result || 'fail' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Sensor AID:** ${{ steps.aid.outputs.result || 'not run' }} ${{ steps.aid.outputs.aid }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Attribution:** \`CS_CLOUD_SERVICE=ACI\` + \`CS_AZURE_CONTAINER_GROUP\` (runtime)" >> $GITHUB_STEP_SUMMARY
          echo "- **URL:** http://${{ steps.deploy.outputs.fqdn }}" >> $GITHUB_STEP_SUMMARY
