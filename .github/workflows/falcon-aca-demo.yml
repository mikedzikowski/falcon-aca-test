# falcon-aca-demo.yml
# GitHub Actions workflow: patch a container image with the CrowdStrike Falcon
# Container sensor, gate it against a Falcon image-assessment POLICY, and deploy
# the patched image to Azure Container Apps, Azure Container Instances, and/or
# Azure App Service on success.
#
# DEMO KNOB: `demoScenario` selects which (if any) defect is baked into the
# workload image so you can show the image-assessment gate blocking each
# detection type, then flip to `clean` to show it pass and deploy.
#
#   clean         -> healthy app            -> gate PASSES  -> deploys
#   vulnerability -> aiohttp==3.9.1          -> CVE-2024-23334 -> gate BLOCKS
#   malware       -> pull known-malware img  -> Malware detections -> gate BLOCKS
#   supplychain   -> compromised npm pkgs    -> Malicious / CompromisedPackage -> gate BLOCKS
#
# THE GATE
# --------
# The authoritative verdict is the Falcon console image-assessment policy
# "mikedz-aca-demo-gate" (scoped to this repo). FCS CLI exit codes, per the
# "FCS CLI Image Scan Results" doc:
#   0 = NO ACTION (pass)   1 = Prevent rule matched (BLOCK)
#   2 = Alert rule matched (non-blocking — passes with a warning)
#   201-207 = tool errors (auth, scan, report) — hard failure, never a pass
# The exit code must agree with PolicyResponse in the scan JSON or the gate fails
# closed. Two pipeline-side checks back the policy up:
#   * detection guard — an image with Malware / Malicious / CompromisedPackage
#     detections is never promoted, even if the policy failed to match them (the
#     supply-chain detection type changed on the feed side on 2026-10-30).
#   * scenario check — vulnerability/malware/supplychain are deliberately bad
#     images; if one of them gets past the gate the run fails loudly instead of
#     deploying it.
#
# ONE IMAGE, THREE TARGETS
# ------------------------
# The image is patched ONCE with no platform-specific attribution flags. Every
# falconutil patch-time flag has a documented runtime env-var override ("The
# environment variable overrides the value set by the --X flag"), so each deploy
# job stamps its own attribution via CS_* env vars:
#
#   ACA         -> CS_CLOUD_SERVICE=ACA + CS_AZURE_RESOURCE_GROUP + CS_AZURE_SUBSCRIPTION
#   ACI         -> CS_CLOUD_SERVICE=ACI + CS_AZURE_CONTAINER_GROUP + resource group +
#                  subscription. Docs are explicit that without the ACI value
#                  "these deployments won't be listed under ACI".
#   App Service -> CS_APP_NAME + CS_CONTAINER, and CS_CLOUD_SERVICE deliberately
#                  UNSET (there is no App Service enum; ACA/ACI/ECS_FARGATE/CLOUDRUN
#                  are the only accepted values — stamping ACA here would attribute
#                  the workload to a container app resource that does not exist).
#
# Every run gets a UNIQUE tag (<sha8>-<run id>-<attempt>). Reusing a tag let a
# later run silently re-point an already-deployed tag at a different image, and
# made "the app answered 200" meaningless. The app reports the build id it was
# built with on /health, and every deploy job requires that exact id.
#
# PUBLIC-REPO HYGIENE (this repo and its logs/artifacts are public)
# ------------------------------------------------------------------
#   * Azure identifiers (subscription/tenant/client ids, ACR, resource names) are
#     read from SECRETS so the runner masks them; runtime-derived values (FQDNs,
#     resource ids, sensor AIDs) are ::add-mask::'d as soon as they are computed.
#   * The raw FCS scan JSON embeds the patched image config, which carries the
#     CID (falconutil bakes it into FALCONCTL_OPTS). It is NEVER uploaded; only an
#     allowlisted extract (policy verdict, counts, detections) is.
#   * Job outputs that cross jobs carry no masked values (GitHub drops those), so
#     the deploy jobs rebuild the image ref from secrets + the tag.
#   * Container logs are dumped through a filter that redacts IPv4 addresses and
#     32-hex ids.
#
# SECURITY NOTE: --cid is baked into the patched image at patch time and has no
# runtime override. The patched image is therefore a CID-bearing artifact — the
# registry must stay private (anonymous pull disabled).

name: Build and Deploy Falcon Container (ACA + ACI + App Service)

on:
  workflow_dispatch:
    inputs:
      demoScenario:
        type: choice
        default: 'clean'
        description: 'Which defect to bake into the image (drives the gate demo)'
        options:
          - 'clean'
          - 'vulnerability'
          - 'malware'
          - 'supplychain'
      deployTarget:
        type: choice
        default: 'all'
        description: 'Where to deploy the patched image (only if the gate passes)'
        options:
          - 'none'
          - 'aca'
          - 'appservice'
          - 'aci'
          - 'all'
      runFCSScan:
        type: boolean
        default: true
        description: 'Run Falcon Container Security scan on patched image (an unscanned image is never promoted)'
      falconRegion:
        type: choice
        default: 'us-1'
        description: 'CrowdStrike Falcon cloud region'
        options:
          - 'us-1'
          - 'us-2'
          - 'eu-1'
          - 'us-gov-1'
          - 'us-gov-2'
      failOnPolicyViolation:
        type: boolean
        default: true
        description: 'Fail the build if the image-assessment policy denies the image'
  push:
    branches: [main]
  schedule:
    # Daily (not hourly) at an off-minute to avoid the top-of-hour API stampede
    # and keep cost/noise down for a demo repo.
    - cron: '17 2 * * *'

permissions:
  id-token: write    # Azure OIDC
  contents: read

env:
  # Unique repo name so the scoped image-assessment policy can't collide with
  # any other image on the shared demo tenant.
  IMAGE_REPO: mikedz-falcon-aca
  # Public known-malware test image (nginx-based; WannaCry/Mirai/XMRig samples).
  MALWARE_SOURCE_IMAGE: quay.io/petr_ruzicka/malware-cryptominer-container:3
  # Logical container name baked in via --container; each deploy job can override
  # it at runtime with CS_CONTAINER.
  FALCON_CONTAINER_NAME: mikedz-falcon-workload

jobs:
  build-scan-and-gate:
    name: Build, Patch, Scan & Gate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # One build per scenario at a time; different scenarios can run side by side
    # (each run has unique tags, so they never collide in the registry).
    concurrency:
      group: falcon-build-${{ github.ref }}-${{ inputs.demoScenario || 'clean' }}
      cancel-in-progress: false

    env:
      ACR_NAME: ${{ secrets.ACR_NAME }}

    outputs:
      # Tag only — NOT the full ref. The ref contains the (masked) ACR login
      # server, and GitHub silently drops job outputs that contain a masked value.
      patched-image-tag: ${{ steps.vars.outputs.prod_tag }}
      build-id: ${{ steps.vars.outputs.build_id }}
      scan-passed: ${{ steps.gate.outputs.passed }}
      scenario: ${{ steps.vars.outputs.scenario }}
      # Resolved here (not read from inputs.* in the deploy jobs) so that the
      # push/schedule triggers — which have no inputs — still get a real target
      # instead of an empty string that silently matches nothing.
      deploy-target: ${{ steps.vars.outputs.deploy_target }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: CrowdStrike IaC Scan (shift-left, non-blocking)
        uses: crowdstrike/fcs-action@01930f3d7eb5a9ded52e558abf56452f1bc5b46d # v5.0.3
        id: fcs-iac
        continue-on-error: true
        with:
          falcon_client_id: ${{ secrets.FALCON_CLIENT_ID }}
          falcon_region: ${{ inputs.falconRegion || 'us-1' }}
          scan_type: 'iac'
          path: './'
          report_formats: 'json'
          output_path: './scan-iac.json'
          upload_results: true
          no_color: true
        env:
          FALCON_CLIENT_SECRET: ${{ secrets.FALCON_CLIENT_SECRET }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Set image variables
        id: vars
        run: |
          set -euo pipefail

          # Default scenario/target so push & schedule triggers (no inputs) still work.
          SCENARIO="${{ inputs.demoScenario || 'clean' }}"
          TARGET="${{ inputs.deployTarget || 'aca' }}"
          REGISTRY="${ACR_NAME}.azurecr.io"
          SHA8=$(echo "$GITHUB_SHA" | cut -c1-8)
          # Unique per run AND attempt: a tag is never re-pointed once deployed.
          BUILD_ID="${SHA8}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          echo "scenario=${SCENARIO}"                                         >> $GITHUB_OUTPUT
          echo "deploy_target=${TARGET}"                                      >> $GITHUB_OUTPUT
          echo "build_id=${BUILD_ID}"                                         >> $GITHUB_OUTPUT
          echo "base_image=${REGISTRY}/${IMAGE_REPO}:${BUILD_ID}-${SCENARIO}-src" >> $GITHUB_OUTPUT
          # Staging (quarantine) tag: the patched image is published HERE first so
          # Falcon can run full registry assessment (incl. malware cloud detection,
          # which does NOT run on a local-only scan). Promoted to the prod tag only
          # if the gate passes; deleted from staging either way.
          echo "staging_patched=${REGISTRY}/${IMAGE_REPO}-staging:${BUILD_ID}-${SCENARIO}-patched" >> $GITHUB_OUTPUT
          echo "staging_display=${IMAGE_REPO}-staging:${BUILD_ID}-${SCENARIO}-patched"            >> $GITHUB_OUTPUT
          echo "prod_tag=${BUILD_ID}-patched"                                 >> $GITHUB_OUTPUT
          echo "prod_patched=${REGISTRY}/${IMAGE_REPO}:${BUILD_ID}-patched"   >> $GITHUB_OUTPUT
          echo "sensor_image=${REGISTRY}/falcon-container:${SHA8}"            >> $GITHUB_OUTPUT

          # Friendly platform names for the run summary. The raw key (aca/aci/
          # appservice/all) drives the job conditions; this is display only.
          case "$TARGET" in
            none)       TARGET_LABEL="none — build and gate only" ;;
            aca)        TARGET_LABEL="Azure Container Apps" ;;
            aci)        TARGET_LABEL="Azure Container Instances" ;;
            appservice) TARGET_LABEL="Azure App Service" ;;
            all)        TARGET_LABEL="Azure Container Apps + Azure Container Instances + Azure App Service" ;;
            *)          TARGET_LABEL="$TARGET" ;;
          esac
          echo "### 🎬 Demo scenario: \`${SCENARIO}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Deploy target:** ${TARGET_LABEL} &nbsp;|&nbsp; **Build id:** \`${BUILD_ID}\`" >> $GITHUB_STEP_SUMMARY

      - name: Azure login via OIDC
        uses: azure/login@7ddb5af1ef8758cf1353cf3b42f940aee27ba21c # v3.0.2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Login to Azure Container Registry
        run: |
          set -euo pipefail
          # az acr login avoids the docker credential-helper conflict entirely.
          az acr login --name "$ACR_NAME"
        timeout-minutes: 2

      - name: Prepare source image (per scenario)
        id: prepare-source
        run: |
          set -euo pipefail
          SCENARIO="${{ steps.vars.outputs.scenario }}"
          BASE_IMAGE="${{ steps.vars.outputs.base_image }}"

          # SECURITY: build/pull the workload image LOCALLY only. It is NOT pushed
          # to ACR here — nothing reaches the registry until it has been patched,
          # scanned, and has PASSED the image-assessment gate (see the push step
          # after the gate). falconutil patches the local image (IfNotPresent).
          if [ "$SCENARIO" = "malware" ]; then
            echo "Pulling known-malware test image: ${MALWARE_SOURCE_IMAGE}"
            docker pull "${MALWARE_SOURCE_IMAGE}"
            docker tag "${MALWARE_SOURCE_IMAGE}" "${BASE_IMAGE}"
          elif [ "$SCENARIO" = "supplychain" ]; then
            # Separate Dockerfile: the fixture is alpine-based with npm manifests,
            # not the python:3.12-slim app, so it cannot be a SCENARIO branch of the
            # main Dockerfile without a conditional FROM.
            echo "Building supply-chain fixture from Dockerfile.supplychain (local only)..."
            docker build -f Dockerfile.supplychain -t "${BASE_IMAGE}" .
          else
            # BUILD_ID is baked in BEFORE patching so it is inside the scanned
            # digest; the deploy jobs require /health to report it.
            echo "Building scenario '${SCENARIO}' from Dockerfile (local only)..."
            docker build \
              --build-arg "SCENARIO=${SCENARIO}" \
              --build-arg "BUILD_ID=${{ steps.vars.outputs.build_id }}" \
              -t "${BASE_IMAGE}" .
          fi
          echo "Source image staged locally (NOT pushed): ${BASE_IMAGE}"
        timeout-minutes: 10

      - name: Pull Falcon Container Sensor
        id: pull-sensor
        run: |
          set -euo pipefail
          echo "Downloading falcon-container-sensor-pull.sh v1.13.0..."
          curl -fsSL -o falcon-pull.sh \
            "https://github.com/CrowdStrike/falcon-scripts/releases/download/v1.13.0/falcon-container-sensor-pull.sh"
          chmod +x falcon-pull.sh

          SENSOR_OUTPUT=$(./falcon-pull.sh \
            --client-id "${{ secrets.FALCON_CLIENT_ID }}" \
            --client-secret "${{ secrets.FALCON_CLIENT_SECRET }}" \
            --type falcon-container \
            --platform x86_64 \
            --region "${{ inputs.falconRegion || 'us-1' }}")

          SENSOR_IMAGE=$(echo "$SENSOR_OUTPUT" | grep -E "(Downloaded newer image for|Pull complete)" | tail -1 | awk '{print $NF}' || echo "")
          if [ -z "$SENSOR_IMAGE" ]; then
            echo "::error::Failed to extract sensor image reference"; echo "$SENSOR_OUTPUT"; exit 1
          fi
          echo "Sensor image: $SENSOR_IMAGE"

          docker tag "$SENSOR_IMAGE" "${{ steps.vars.outputs.sensor_image }}"
          # Retried for the same reason as the staging push below (parallel runs).
          for attempt in 1 2 3 4; do
            docker push "${{ steps.vars.outputs.sensor_image }}" && break
            [ "$attempt" = 4 ] && { echo "::error::docker push failed after 4 attempts"; exit 1; }
            echo "::warning::docker push attempt ${attempt} failed; retrying in $((attempt * 15))s"
            sleep $((attempt * 15))
          done

      - name: Patch image with Falcon sensor, publish to STAGING
        id: patch-image
        run: |
          set -euo pipefail
          BASE_IMAGE="${{ steps.vars.outputs.base_image }}"
          SENSOR_IMAGE="${{ steps.vars.outputs.sensor_image }}"
          TARGET_IMAGE="${{ steps.vars.outputs.staging_patched }}"

          echo "Patching ${BASE_IMAGE} with sensor ${SENSOR_IMAGE} -> ${TARGET_IMAGE} (staging)..."
          # Platform-AGNOSTIC patch: no --cloud-service / --resource-group /
          # --subscription here. Each has a runtime CS_* override, so the deploy
          # jobs stamp attribution per target. One image serves all three.
          #
          # falconutil sets /opt/CrowdStrike/rootfs/bin/falcon-entrypoint as the
          # image ENTRYPOINT and chains to the original entrypoint after starting
          # the sensor. The sensor runs through its own dynamic loader with its own
          # libc under /opt/CrowdStrike/rootfs/lib64, so the base image's libc is
          # irrelevant.
          docker run --user 0:0 \
            -v /var/run/docker.sock:/var/run/docker.sock \
            --rm "${SENSOR_IMAGE}" \
            falconutil patch-image \
            --source-image-uri "${BASE_IMAGE}" \
            --target-image-uri "${TARGET_IMAGE}" \
            --falcon-image-uri "${SENSOR_IMAGE}" \
            --image-pull-policy IfNotPresent \
            --container "${FALCON_CONTAINER_NAME}" \
            --cid "${{ secrets.FALCON_CID }}"

          # Publish the patched image to the STAGING repo so Falcon can run a full
          # registry assessment (malware cloud detection does not run on a local-only
          # scan). This is a quarantine location — the deployable repo is untouched
          # until the gate passes and we promote.
          # Retried: when scenarios run in parallel they all upload the same sensor
          # layer at the same moment, and ACR fails the colliding blob uploads with
          # "unexpected EOF". A push is idempotent, so a retry just finishes it.
          echo "Publishing patched image to staging: ${TARGET_IMAGE}"
          for attempt in 1 2 3 4; do
            docker push "${TARGET_IMAGE}" && break
            [ "$attempt" = 4 ] && { echo "::error::docker push failed after 4 attempts"; exit 1; }
            echo "::warning::docker push attempt ${attempt} failed; retrying in $((attempt * 15))s"
            sleep $((attempt * 15))
          done

          # Registry manifest digest (NOT the local image id falconutil prints).
          DIGEST=$(az acr repository show --name "$ACR_NAME" --image "${TARGET_IMAGE#*/}" --query digest -o tsv)
          echo "digest=${DIGEST}" >> $GITHUB_OUTPUT
          echo "ref=${TARGET_IMAGE}" >> $GITHUB_OUTPUT
          echo "Staging manifest digest: ${DIGEST}"

      - name: CrowdStrike Image Scan (policy gate)
        uses: crowdstrike/fcs-action@01930f3d7eb5a9ded52e558abf56452f1bc5b46d # v5.0.3
        id: fcs-scan
        # NOTE: `inputs.runFCSScan == null || inputs.runFCSScan` is always true —
        # GitHub expressions coerce null == false. Key off the event instead.
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.runFCSScan }}
        # Scans the patched image in the STAGING repo (registry assessment). A local
        # (socket) scan returns vulnerabilities/CIS/misconfig but NOT Falcon malware
        # cloud detection — verified on both v2.0.2 and v5.0.3 — so the image must be
        # in a registry for the gate to catch malware.
        # The step itself succeeds whatever the verdict; the CLI exit code is
        # passed through in outputs.exit-code and evaluated by the gate below.
        with:
          falcon_client_id: ${{ secrets.FALCON_CLIENT_ID }}
          falcon_region: ${{ inputs.falconRegion || 'us-1' }}
          scan_type: 'image'
          image: ${{ steps.patch-image.outputs.ref }}
          minimum_exprt: 'critical'
          report_formats: 'json'
          output_path: './scan-image.json'
          upload_results: true
          no_color: true
        env:
          FALCON_CLIENT_SECRET: ${{ secrets.FALCON_CLIENT_SECRET }}

      - name: Evaluate gate (policy verdict + detection guard + scenario check)
        id: gate
        if: ${{ always() && steps.patch-image.outcome == 'success' }}
        env:
          RC: ${{ steps.fcs-scan.outputs.exit-code }}
          SCAN_OUTCOME: ${{ steps.fcs-scan.outcome }}
          SCENARIO: ${{ steps.vars.outputs.scenario }}
        # Never exits non-zero itself: it always publishes passed / verdict /
        # blocked_by / hard so the summary renders and the staging image is cleaned
        # up. The BLOCKED step below is what fails the build.
        run: |
          set -uo pipefail
          REPORT=scan-image.json
          out() { echo "$1=$2" >> "$GITHUB_OUTPUT"; }
          finish() {  # passed verdict blocked_by hard reason
            out passed "$1"; out verdict "$2"; out blocked_by "$3"; out hard "$4"; out reason "$5"
            echo "Gate: passed=$1 verdict=$2 blocked_by=${3:-none} hard=$4 — $5"
            exit 0
          }

          if [ "$SCAN_OUTCOME" = "skipped" ]; then
            echo "::notice::Image scan disabled (runFCSScan=false). The image is UNGATED, so it will not be promoted or deployed."
            finish false skipped scan-disabled false "scan disabled; ungated image is not promoted"
          fi
          if [ "$SCAN_OUTCOME" != "success" ]; then
            echo "::error::Image scan step ${SCAN_OUTCOME} before producing a verdict."
            finish false error tool true "scan step ${SCAN_OUTCOME}"
          fi

          # Policy verdict from the JSON. PolicyResponse.action is only present when
          # deny=true (alert|block); deny alone cannot tell ALERT from BLOCK.
          VERDICT=""
          if [ -s "$REPORT" ] && jq -e '.PolicyResponse|type=="object"' "$REPORT" >/dev/null 2>&1; then
            VERDICT=$(jq -r '.PolicyResponse as $p
              | if ($p.deny==false) and (($p.action//"")=="") then "none"
                elif $p.deny==true then (($p.action//"missing")|ascii_downcase)
                else "unknown" end' "$REPORT")
          fi

          case "$RC" in
            0|1|2) ;;
            "")      echo "::error::No exit code from the image scan."; finish false error tool true "no exit code" ;;
            20[1-7]) echo "::error::FCS CLI tool error ${RC} (201 input, 202 auth, 203 scan, 204/205 report, 206 SBOM, 207 scan errors)."; finish false error tool true "FCS CLI error ${RC}" ;;
            *)       echo "::error::Unexpected FCS CLI exit code ${RC}."; finish false error tool true "unexpected exit ${RC}" ;;
          esac

          case "${RC}:${VERDICT}" in
            0:none)  POLICY=pass ;;
            2:alert) POLICY=alert ;;
            1:*)     POLICY=block ;;
            *) echo "::error::Exit code ${RC} disagrees with the policy verdict in the report ('${VERDICT:-<none>}')."
               finish false error tool true "exit ${RC} vs report '${VERDICT:-none}'" ;;
          esac

          if [ "$POLICY" = "block" ]; then
            finish false block policy false "Falcon policy BLOCK (exit 1)"
          fi
          if [ "$POLICY" = "alert" ]; then
            MATCHED=$(jq -r '.PolicyResponse.evaluation_details // {} | to_entries | map(select(.value != null and .value != [])) | map(.key) | join(",")' "$REPORT")
            echo "::warning::Falcon policy ALERT (exit 2, non-blocking). Matched: ${MATCHED:-?}. The image passes; review the alert in the console."
          fi

          # Detection guard: never promote an image Falcon itself flagged as
          # malware / malicious / a compromised package, even if the policy's block
          # rule failed to match that detection type.
          GUARD=$(jq -r '[.Detections[]?.Detection | select((.Type // "" | ascii_downcase) as $t
                     | ["malware","malicious","compromisedpackage"] | index($t))] | length' "$REPORT")
          if [ "${GUARD:-0}" != "0" ]; then
            TYPES=$(jq -r '[.Detections[]?.Detection.Type] | unique | join(",")' "$REPORT")
            echo "::error::Falcon reported ${GUARD} Malware/Malicious/CompromisedPackage detection(s) but the image-assessment policy did not block (verdict '${POLICY}'). The policy's block rule is not matching these detection types (${TYPES}) — fix the policy. The pipeline guard is blocking the image."
            finish false "$POLICY" guard false "detection guard: ${GUARD} malware/malicious/compromised-package detections the policy did not block"
          fi

          # Scenario check: these images are bad on purpose — if one passes, the
          # policy is not doing its job and the demo would prove nothing.
          case "$SCENARIO" in
            vulnerability|malware|supplychain)
              echo "::error::Scenario '${SCENARIO}' is built to be blocked, but the policy verdict was '${POLICY}'. The image-assessment policy rule for this scenario is not matching — fix the policy (see README)."
              finish false "$POLICY" scenario-check true "scenario '${SCENARIO}' expected BLOCK but policy said '${POLICY}'" ;;
          esac

          finish true "$POLICY" "" false "policy ${POLICY}"

      - name: Render FCS scan results & publish summary
        if: ${{ always() && steps.patch-image.outcome == 'success' }}
        env:
          IMAGE: ${{ steps.vars.outputs.staging_display }}
          RC: ${{ steps.fcs-scan.outputs.exit-code }}
          SCENARIO: ${{ steps.vars.outputs.scenario }}
          PASSED: ${{ steps.gate.outputs.passed }}
          VERDICT: ${{ steps.gate.outputs.verdict }}
          BLOCKED_BY: ${{ steps.gate.outputs.blocked_by }}
          REASON: ${{ steps.gate.outputs.reason }}
        run: |
          set +e
          SUMMARY=fcs-summary.md
          : > "$SUMMARY"

          if [ "$PASSED" = "true" ] && [ "$VERDICT" = "alert" ]; then
            echo "## ⚠️ Falcon image-assessment passed with a policy ALERT" >> "$SUMMARY"
          elif [ "$PASSED" = "true" ]; then
            echo "## ✅ Falcon image-assessment passed" >> "$SUMMARY"
          elif [ "$BLOCKED_BY" = "policy" ]; then
            echo "## ❌ Image blocked by Falcon image-assessment policy" >> "$SUMMARY"
          elif [ "$BLOCKED_BY" = "guard" ]; then
            echo "## ❌ Image blocked by the pipeline detection guard (policy did not match)" >> "$SUMMARY"
          elif [ "$BLOCKED_BY" = "scenario-check" ]; then
            echo "## ❌ Scenario expected to be blocked was NOT blocked by the policy" >> "$SUMMARY"
          elif [ "$BLOCKED_BY" = "scan-disabled" ]; then
            echo "## ⏭️ Scan disabled — image not gated, not promoted" >> "$SUMMARY"
          else
            echo "## 💥 Gate error — no trustworthy verdict" >> "$SUMMARY"
          fi
          echo "" >> "$SUMMARY"
          echo "**Scenario:** \`${SCENARIO}\` &nbsp;|&nbsp; **Image:** \`${IMAGE}\` &nbsp;|&nbsp; **FCS exit:** \`${RC:-n/a}\` &nbsp;|&nbsp; **Reason:** ${REASON}" >> "$SUMMARY"
          echo "" >> "$SUMMARY"

          if [ -f scan-image.json ]; then
            # Allowlisted extract — the ONLY scan data that leaves the runner. The raw
            # report embeds the image config (incl. the CID in FALCONCTL_OPTS), the
            # registry host and tenant ids, so it is never uploaded.
            jq '{
                policy: (.PolicyResponse // {} | {
                  result: (if .deny==true then (.action // "unknown") else "no action" end),
                  name: .policy.name, evaluated_at,
                  # Detection ids are reduced to a count; CVEs / base OS / packages kept.
                  matched: (.evaluation_details // {} | with_entries(
                    if .key == "matched_detection_list" or .key == "excluded_detection_list"
                    then .value |= (if . == null then null else length end) else . end)) }),
                vulnerabilities: .VulnerabilitiesSummary,
                detections_summary: .DetectionsSummary,
                detections: [ .Detections[]? | .Detection | {
                  type: .Type, name: .Name, severity: .Severity, title: .Title,
                  package: (.Details.Package? // null), version: (.Details.Version? // null),
                  path: (.Details.Path? // null) } ]
              }' scan-image.json > scan-report.json

            POLICY_NAME=$(jq -r '.policy.name // "N/A"' scan-report.json)
            RESULT=$(jq -r '.policy.result | ascii_upcase' scan-report.json)
            echo "### Container Image Assessment" >> "$SUMMARY"; echo "" >> "$SUMMARY"
            echo "**Policy:** ${POLICY_NAME} &nbsp;|&nbsp; **Policy result:** \`${RESULT}\`" >> "$SUMMARY"
            echo "" >> "$SUMMARY"
            echo "| | Critical | High | Medium | Low | Total |" >> "$SUMMARY"
            echo "|--|--|--|--|--|--|" >> "$SUMMARY"
            jq -r '"| Vulnerabilities | \(.vulnerabilities.severities.critical // 0) | \(.vulnerabilities.severities.high // 0) | \(.vulnerabilities.severities.medium // 0) | \(.vulnerabilities.severities.low // 0) | \(.vulnerabilities.count // 0) |",
                   "| Detections | \(.detections_summary.severities.critical // 0) | \(.detections_summary.severities.high // 0) | \(.detections_summary.severities.medium // 0) | \(.detections_summary.severities.low // 0) | \(.detections_summary.count // 0) |"' scan-report.json >> "$SUMMARY"
            echo "" >> "$SUMMARY"

            MATCHED=$(jq -r '.policy.matched // {} | to_entries | map(select(.value != null and .value != [])) | map("\(.key)=\(.value|tostring)") | join("; ")' scan-report.json)
            [ -n "$MATCHED" ] && { echo "**Policy matched:** \`${MATCHED}\`" >> "$SUMMARY"; echo "" >> "$SUMMARY"; }

            MAL=$(jq -r '[.detections[] | select((.type|ascii_downcase)=="malware")] | length' scan-report.json)
            if [ "${MAL:-0}" != "0" ]; then
              echo "### 🦠 Malware — ${MAL} detection(s)" >> "$SUMMARY"; echo "" >> "$SUMMARY"
              jq -r '[.detections[] | select((.type|ascii_downcase)=="malware") | "- \(.name): \(.title // "") \(if .path then "(`"+.path+"`)" else "" end)"] | unique | .[:15][]' scan-report.json >> "$SUMMARY"
              echo "" >> "$SUMMARY"
            fi

            # Supply-chain findings come as Type=CompromisedPackage/CompromisedNPMPackage
            # and/or Type=Malicious/KnownCompromisedNPMPackage (the feed has emitted
            # both, and switched between them).
            SC=$(jq -r '[.detections[] | select(.type=="CompromisedPackage" or .type=="Malicious")] | length' scan-report.json)
            if [ "${SC:-0}" != "0" ]; then
              echo "### 🔗 Supply chain — compromised packages" >> "$SUMMARY"; echo "" >> "$SUMMARY"
              # CompromisedPackage gives Package + Version; Malicious gives "name-version"
              # in Package with no Version field.
              jq -r '[.detections[] | select(.type=="CompromisedPackage" or .type=="Malicious")
                      | "- `\(.package // "?")\(if .version then "@"+.version else "" end)` — \(.type)/\(.name) (\(.severity))"] | unique[]' scan-report.json >> "$SUMMARY"
              echo "" >> "$SUMMARY"
            fi
          fi

          cat "$SUMMARY" >> "$GITHUB_STEP_SUMMARY"
          true

      - name: Upload scan reports (redacted)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: falcon-scan-reports-${{ steps.vars.outputs.build_id }}-${{ steps.vars.outputs.scenario }}
          # NEVER add scan-image.json here: it contains the CID (see header).
          path: |
            scan-report.json
            scan-iac.json
            fcs-summary.md
          if-no-files-found: ignore
          retention-days: 30

      - name: Gate BLOCKED — delete staging image, fail build
        # Not promoted, ever. The quarantined image is removed from staging.
        if: ${{ always() && steps.gate.outcome == 'success' && steps.gate.outputs.passed != 'true' }}
        env:
          FAIL_ON_VIOLATION: ${{ github.event_name != 'workflow_dispatch' || inputs.failOnPolicyViolation }}
          HARD: ${{ steps.gate.outputs.hard }}
          BLOCKED_BY: ${{ steps.gate.outputs.blocked_by }}
          REASON: ${{ steps.gate.outputs.reason }}
          SCENARIO: ${{ steps.vars.outputs.scenario }}
        run: |
          set -euo pipefail
          STAGING="${{ steps.vars.outputs.staging_patched }}"
          echo "Gate did not pass (${REASON}) — deleting quarantined image ${{ steps.vars.outputs.staging_display }}..."
          az acr repository delete --name "$ACR_NAME" --image "${STAGING#*/}" --yes -o none 2>/dev/null || echo "(nothing to delete)"
          if [ "$BLOCKED_BY" = "scan-disabled" ]; then
            echo "Scan disabled — nothing promoted, not failing."; exit 0
          fi
          if [ "$HARD" = "true" ]; then
            echo "::error::Gate could not be trusted (${REASON}). Nothing promoted."
            exit 1
          fi
          if [ "$FAIL_ON_VIOLATION" = "true" ]; then
            echo "::error::Image denied (${REASON}, scenario='${SCENARIO}'). Quarantine deleted; nothing promoted. Remediate (or run scenario=clean) to clear the gate."
            exit 1
          fi
          echo "::warning::Image denied (${REASON}) but failOnPolicyViolation=false; not failing. Image was NOT promoted."

      - name: Gate PASSED — promote staging → deployable repo
        # Only a passed image is promoted to the deployable repo/tag. Staging is
        # then cleaned up. Retag+push preserves the manifest digest, so the image
        # deployed below is byte-for-byte the image that was scanned.
        if: ${{ steps.gate.outputs.passed == 'true' }}
        run: |
          set -euo pipefail
          STAGING="${{ steps.vars.outputs.staging_patched }}"
          PROD="${{ steps.vars.outputs.prod_patched }}"
          echo "Gate passed — promoting ${STAGING} -> ${PROD}"
          docker tag "${STAGING}" "${PROD}"
          for attempt in 1 2 3 4; do
            docker push "${PROD}" && break
            [ "$attempt" = 4 ] && { echo "::error::docker push failed after 4 attempts"; exit 1; }
            echo "::warning::docker push attempt ${attempt} failed; retrying in $((attempt * 15))s"
            sleep $((attempt * 15))
          done
          PROD_DIGEST=$(az acr repository show --name "$ACR_NAME" --image "${PROD#*/}" --query digest -o tsv)
          if [ "$PROD_DIGEST" != "${{ steps.patch-image.outputs.digest }}" ]; then
            echo "::error::Promoted digest ${PROD_DIGEST} != scanned digest ${{ steps.patch-image.outputs.digest }}"; exit 1
          fi
          echo "Promoted (digest ${PROD_DIGEST}, identical to the scanned image)."
          az acr repository delete --name "$ACR_NAME" --image "${STAGING#*/}" --yes -o none 2>/dev/null || echo "(staging already gone)"

  # ---------------------------------------------------------------------------
  # Deploy: Azure Container Apps
  # ---------------------------------------------------------------------------
  deploy-aca:
    name: Deploy to Azure Container Apps
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: build-scan-and-gate
    if: >-
      ${{ needs.build-scan-and-gate.outputs.scan-passed == 'true' &&
          (needs.build-scan-and-gate.outputs.deploy-target == 'aca' ||
           needs.build-scan-and-gate.outputs.deploy-target == 'all') }}
    environment: production
    concurrency:
      group: falcon-deploy-aca
      cancel-in-progress: false

    env:
      RG: ${{ secrets.RESOURCE_GROUP }}
      APP: ${{ secrets.CONTAINER_APP_NAME }}
      ACA_ENV: ${{ secrets.ACA_ENV_NAME }}
      ACR_NAME: ${{ secrets.ACR_NAME }}
      SUB: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      LOCATION: ${{ vars.AZURE_LOCATION }}
      TAG: ${{ needs.build-scan-and-gate.outputs.patched-image-tag }}
      EXPECTED_BUILD_ID: ${{ needs.build-scan-and-gate.outputs.build-id }}
      # Redacts IPv4 addresses and 32-hex ids from any container/platform log we
      # print (aiohttp/ingress logs carry client IPs; sensor output can carry ids).
      REDACT: 's/([0-9]{1,3}\.){3}[0-9]{1,3}/<ip>/g; s/[0-9a-fA-F]{32}/<hex32>/g'

    steps:
      - name: Azure login via OIDC
        uses: azure/login@7ddb5af1ef8758cf1353cf3b42f940aee27ba21c # v3.0.2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Ensure Container Apps environment exists
        id: ensure-environment
        run: |
          set -euo pipefail
          if az containerapp env show --name "$ACA_ENV" --resource-group "$RG" -o none 2>/dev/null; then
            echo "Environment already exists"; echo "status=exists" >> $GITHUB_OUTPUT
          else
            echo "Creating environment..."
            az containerapp env create --name "$ACA_ENV" --resource-group "$RG" --location "$LOCATION" --logs-destination none -o none
            echo "status=created" >> $GITHUB_OUTPUT
          fi

      - name: Deploy to Azure Container Apps
        id: deploy
        # Deploy via az CLI (not the action) so we can configure ACR pull through
        # our user-assigned managed identity. Our OIDC identity already holds
        # AcrPush (which includes pull), so we attach it to the app and point the
        # registry at it.
        run: |
          set -euo pipefail
          IMAGE="${ACR_NAME}.azurecr.io/${IMAGE_REPO}:${TAG}"
          # A revision suffix owned by THIS run. Without a template change ACA
          # creates no new revision at all and the old one silently keeps serving.
          SUFFIX="r${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          # ACA attribution, applied at RUNTIME (the image itself was patched
          # platform-agnostically). These override the equivalent patch-time flags.
          CS_ENV="CS_CLOUD_SERVICE=ACA CS_AZURE_RESOURCE_GROUP=${RG} CS_AZURE_SUBSCRIPTION=${SUB} CS_CONTAINER=${APP}"

          UAMI_ID=$(az identity list -g "$RG" --query "[?clientId=='${CLIENT_ID}'].id | [0]" -o tsv)
          if [ -z "$UAMI_ID" ]; then
            echo "::error::Could not resolve the user-assigned identity in the resource group"; exit 1
          fi
          echo "::add-mask::${UAMI_ID}"

          # If the app exists but is stuck in a Failed provisioning state (e.g. a
          # prior broken create), delete it so we can recreate cleanly — update
          # can't recover a Failed app.
          STATE=$(az containerapp show -n "$APP" -g "$RG" --query "properties.provisioningState" -o tsv 2>/dev/null || echo "NotFound")
          echo "Current provisioning state: ${STATE}"
          if [ "$STATE" = "Failed" ]; then
            echo "App is in Failed state — deleting before recreate..."
            az containerapp delete -n "$APP" -g "$RG" --yes -o none
            STATE="NotFound"
          fi

          if [ "$STATE" != "NotFound" ]; then
            echo "Updating existing Container App (revision suffix ${SUFFIX})..."
            az containerapp registry set -n "$APP" -g "$RG" \
              --server "${ACR_NAME}.azurecr.io" --identity "$UAMI_ID" -o none 2>&1 | sed -E "$REDACT"
            az containerapp update -n "$APP" -g "$RG" --image "$IMAGE" \
              --revision-suffix "$SUFFIX" --set-env-vars $CS_ENV -o none
          else
            echo "Creating Container App (revision suffix ${SUFFIX})..."
            # NOTE: do NOT pass --command here. On ACA --command IS an --entrypoint
            # override and would replace falcon-entrypoint, silently disabling the
            # sensor. If a command is ever required, prepend
            # /opt/CrowdStrike/rootfs/bin/falcon-entrypoint to it.
            az containerapp create -n "$APP" -g "$RG" \
              --environment "$ACA_ENV" \
              --image "$IMAGE" \
              --revision-suffix "$SUFFIX" \
              --target-port 80 --ingress external \
              --min-replicas 1 --max-replicas 1 \
              --user-assigned "$UAMI_ID" \
              --registry-server "${ACR_NAME}.azurecr.io" --registry-identity "$UAMI_ID" \
              --env-vars $CS_ENV \
              -o none
          fi
          echo "revision_suffix=${SUFFIX}" >> $GITHUB_OUTPUT

      - name: Verify THIS run's revision is serving (revision state + build id)
        id: probe
        env:
          REV_SUFFIX: ${{ steps.deploy.outputs.revision_suffix }}
        run: |
          set -euo pipefail
          echo "result=fail" >> $GITHUB_OUTPUT
          IMAGE="${ACR_NAME}.azurecr.io/${IMAGE_REPO}:${TAG}"
          [ -n "$EXPECTED_BUILD_ID" ] && [ -n "$REV_SUFFIX" ] || { echo "::error::build-id or revision suffix is empty"; exit 1; }
          FQDN=$(az containerapp show -n "$APP" -g "$RG" --query properties.configuration.ingress.fqdn -o tsv)
          echo "::add-mask::${FQDN}"
          DEADLINE=$((SECONDS + 600))   # sensor adds startup latency

          dump() {
            az containerapp revision show -n "$APP" -g "$RG" --revision "${LATEST}" \
              --query "{prov:properties.provisioningState,run:properties.runningState,health:properties.healthState,details:properties.runningStateDetails}" -o json 2>&1 | sed -E "$REDACT" || true
            az containerapp logs show -n "$APP" -g "$RG" --revision "${LATEST}" --type console --tail 40 2>&1 | sed -E "$REDACT" || true
            az containerapp logs show -n "$APP" -g "$RG" --type system --tail 40 2>&1 | sed -E "$REDACT" || true
          }

          # 1) The latest revision must be the one THIS run created, with this image.
          LATEST=$(az containerapp show -n "$APP" -g "$RG" --query properties.latestRevisionName -o tsv)
          case "$LATEST" in
            *"--${REV_SUFFIX}") echo "New revision: ${LATEST}" ;;
            *) echo "::error::latestRevisionName=${LATEST} is not this run's revision (*--${REV_SUFFIX})."; exit 1 ;;
          esac
          REV_IMAGE=$(az containerapp revision show -n "$APP" -g "$RG" --revision "$LATEST" \
            --query "properties.template.containers[0].image" -o tsv)
          [ "$REV_IMAGE" = "$IMAGE" ] || { echo "::error::Revision image ${REV_IMAGE} != expected ${IMAGE}"; exit 1; }

          # 2) Platform readiness. Single revision mode keeps the OLD revision at 100%
          #    until the new one is ready, so wait for latestReadyRevisionName to move.
          DEGRADED_SINCE=""
          while :; do
            REV=$(az containerapp revision show -n "$APP" -g "$RG" --revision "$LATEST" -o json)
            PROV=$(jq -r '.properties.provisioningState // ""' <<<"$REV")
            RUN=$(jq -r '.properties.runningState // ""' <<<"$REV")
            HEALTH=$(jq -r '.properties.healthState // ""' <<<"$REV")
            WEIGHT=$(jq -r '.properties.trafficWeight // 0' <<<"$REV")
            READY=$(az containerapp show -n "$APP" -g "$RG" --query properties.latestReadyRevisionName -o tsv)
            RESTARTS=$(az containerapp replica list -n "$APP" -g "$RG" --revision "$LATEST" \
              --query "max([].properties.containers[].restartCount) || \`0\`" -o tsv 2>/dev/null || echo 0)
            echo "  prov=${PROV} run=${RUN} health=${HEALTH} traffic=${WEIGHT} ready=$([ "$READY" = "$LATEST" ] && echo yes || echo no) restarts=${RESTARTS}"

            [ "$PROV" = "Failed" ] && { dump; echo "::error::Revision provisioning Failed"; exit 1; }
            case "$RUN" in
              Failed) dump; echo "::error::Revision runningState=Failed"; exit 1 ;;
              Degraded) DEGRADED_SINCE=${DEGRADED_SINCE:-$SECONDS}
                        if (( SECONDS - DEGRADED_SINCE >= 90 )); then dump; echo "::error::Revision Degraded for 90s"; exit 1; fi ;;
              *) DEGRADED_SINCE="" ;;
            esac
            if [ "${RESTARTS:-0}" -ge 2 ]; then dump; echo "::error::Container restarted ${RESTARTS}x — crash loop (non-web image, or sensor failed closed)"; exit 1; fi

            # The API reports e.g. Running / RunningAtMaxScale.
            if [ "$PROV" = "Provisioned" ] && [ "$READY" = "$LATEST" ] && [[ "$RUN" == Running* ]] \
               && [ "$HEALTH" = "Healthy" ] && [ "$WEIGHT" = "100" ]; then
              echo "Revision ${LATEST} is ready and holds 100% traffic."; break
            fi
            (( SECONDS < DEADLINE )) || { dump; echo "::error::Revision ${LATEST} not ready within 600s"; exit 1; }
            sleep 15
          done

          # 3) End to end: the body must carry THIS build's id (3 consecutive hits).
          OK=0
          while :; do
            BODY=$(curl -sS --max-time 10 -H 'Cache-Control: no-cache' "https://${FQDN}/health" 2>/dev/null || true)
            GOT=$(jq -r '.build_id // empty' <<<"$BODY" 2>/dev/null || true)
            if [ "$GOT" = "$EXPECTED_BUILD_ID" ]; then
              OK=$((OK+1))
              if [ "$OK" -ge 3 ]; then
                echo "/health reports build_id=${GOT} — this run's revision is serving."
                echo "result=pass" >> $GITHUB_OUTPUT; exit 0
              fi
            else
              OK=0; echo "  /health build_id='${GOT:-<none>}' (want ${EXPECTED_BUILD_ID})"
            fi
            (( SECONDS < DEADLINE )) || { dump; echo "::error::Endpoint never reported build_id=${EXPECTED_BUILD_ID}"; exit 1; }
            sleep 5
          done

      - name: Deployment summary
        if: always()
        run: |
          echo "## 🚀 Azure Container Apps — ${{ steps.probe.outputs.result == 'pass' && 'deployed and verified' || 'deployment FAILED verification' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Scenario:** ${{ needs.build-scan-and-gate.outputs.scenario }} (passed the gate)" >> $GITHUB_STEP_SUMMARY
          echo "- **Image:** \`${IMAGE_REPO}:${TAG}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Revision:** created by this run (\`--${{ steps.deploy.outputs.revision_suffix }}\`), environment ${{ steps.ensure-environment.outputs.status }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Serving build id:** ${{ steps.probe.outputs.result == 'pass' && needs.build-scan-and-gate.outputs.build-id || 'not verified' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Attribution:** \`CS_CLOUD_SERVICE=ACA\` (runtime)" >> $GITHUB_STEP_SUMMARY

  # ---------------------------------------------------------------------------
  # Deploy: Azure App Service (Web App for Containers, Linux)
  # ---------------------------------------------------------------------------
  # App Service is NOT one of the four platforms with a tailored CrowdStrike
  # deployment guide (ACA / ACI / ECS_FARGATE / CLOUDRUN). It uses the generic
  # "Falcon Container Sensor embedded in a container image" path, which CrowdStrike
  # documents for "other environments that support deployments based on container
  # images" — with the documented tradeoff that tailored deployments "provide more
  # container visibility in the Falcon console than this more generic method."
  #
  # Why the patched image survives here:
  #   * App Service APPENDS the Startup Command as the [COMMAND] [ARG...] segment —
  #     it replaces CMD, not ENTRYPOINT. falcon-entrypoint still runs. (Unlike ACA,
  #     whose --command genuinely overrides the entrypoint.) We set no startup
  #     command at all, so the chain is untouched.
  #   * The sensor ships in /opt via an image layer, and WEBSITES_ENABLE_APP_SERVICE_STORAGE
  #     only overlays /home — /opt is never masked.
  #   * You get root in the container and background daemons are supported, which is
  #     exactly what falcon-entrypoint needs.
  #
  # App Service keeps serving the OLD container until the new one is ready, so a
  # 200 proves nothing on its own — the probe requires this run's build id.
  # ---------------------------------------------------------------------------
  deploy-appservice:
    name: Deploy to Azure App Service
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: build-scan-and-gate
    if: >-
      ${{ needs.build-scan-and-gate.outputs.scan-passed == 'true' &&
          (needs.build-scan-and-gate.outputs.deploy-target == 'appservice' ||
           needs.build-scan-and-gate.outputs.deploy-target == 'all') }}
    environment: production
    concurrency:
      group: falcon-deploy-appservice
      cancel-in-progress: false

    env:
      RG: ${{ secrets.RESOURCE_GROUP }}
      APP: ${{ secrets.APP_SERVICE_NAME }}
      PLAN: ${{ secrets.APP_SERVICE_PLAN }}
      ACR_NAME: ${{ secrets.ACR_NAME }}
      SUB: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      LOCATION: ${{ vars.AZURE_LOCATION }}
      TAG: ${{ needs.build-scan-and-gate.outputs.patched-image-tag }}
      EXPECTED_BUILD_ID: ${{ needs.build-scan-and-gate.outputs.build-id }}
      REDACT: 's/([0-9]{1,3}\.){3}[0-9]{1,3}/<ip>/g; s/[0-9a-fA-F]{32}/<hex32>/g'

    steps:
      - name: Azure login via OIDC
        uses: azure/login@7ddb5af1ef8758cf1353cf3b42f940aee27ba21c # v3.0.2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Enable ACR ARM-audience authentication
        # Required for managed-identity pulls. Without this, App Service pulls fail
        # with: UNAUTHORIZED "token validation failed". Idempotent.
        run: |
          set -euo pipefail
          az acr config authentication-as-arm update --registry "$ACR_NAME" --status enabled -o none
          echo "ACR ARM-audience auth enabled"

      - name: Ensure Linux App Service plan exists
        id: ensure-plan
        run: |
          set -euo pipefail
          if az appservice plan show -n "$PLAN" -g "$RG" -o none 2>/dev/null; then
            echo "Plan already exists"; echo "status=exists" >> $GITHUB_OUTPUT
          else
            echo "Creating Linux plan (B1)..."
            az appservice plan create -n "$PLAN" -g "$RG" --location "$LOCATION" --is-linux --sku B1 -o none
            echo "status=created" >> $GITHUB_OUTPUT
          fi

      - name: Deploy to Azure App Service
        id: deploy
        run: |
          set -euo pipefail
          IMAGE="${ACR_NAME}.azurecr.io/${IMAGE_REPO}:${TAG}"
          echo "deploy_start=$(date -u +%Y-%m-%dT%H:%M:%S)" >> $GITHUB_OUTPUT

          UAMI_ID=$(az identity list -g "$RG" --query "[?clientId=='${CLIENT_ID}'].id | [0]" -o tsv)
          if [ -z "$UAMI_ID" ]; then
            echo "::error::Could not resolve the user-assigned identity in the resource group"; exit 1
          fi
          echo "::add-mask::${UAMI_ID}"

          if az webapp show -n "$APP" -g "$RG" -o none 2>/dev/null; then
            echo "Web app exists — updating container image..."
          else
            echo "Creating web app..."
            az webapp create -n "$APP" -g "$RG" --plan "$PLAN" --container-image-name "$IMAGE" -o none
          fi

          # Attach the user-assigned identity BEFORE pointing at the new image.
          az webapp identity assign -n "$APP" -g "$RG" --identities "$UAMI_ID" -o none

          # Image + managed-identity pull in ONE config/web update. The old
          # `az webapp config container set` call wrote admin DOCKER_REGISTRY_SERVER_*
          # settings (ACR admin is enabled) and restarted the site before the MI
          # settings landed, so the first pull could use admin creds. NOTE: no
          # startup command is set anywhere, so falcon-entrypoint -> app is intact.
          az resource update -g "$RG" --namespace Microsoft.Web --parent "sites/${APP}" \
            --resource-type config --name web \
            --set "properties.linuxFxVersion=DOCKER|${IMAGE}" \
                  "properties.acrUseManagedIdentityCreds=true" \
                  "properties.acrUserManagedIdentityID=${CLIENT_ID}" -o none

          # Remove any admin-credential settings: they take precedence over the
          # managed identity, so a broken MI config would otherwise pass unnoticed.
          EXISTING=$(az webapp config appsettings list -n "$APP" -g "$RG" \
            --query "[?starts_with(name,'DOCKER_REGISTRY_SERVER_')].name" -o tsv)
          if [ -n "$EXISTING" ]; then
            echo "Removing admin-credential fallback settings: $(echo $EXISTING | tr '\n' ' ')"
            az webapp config appsettings delete -n "$APP" -g "$RG" --setting-names $EXISTING -o none
          fi

          # App settings become container env vars.
          #   WEBSITES_PORT ................ port App Service HTTP-pings and routes to
          #   WEBSITES_CONTAINER_START_TIME_LIMIT ... default is 230s; the sensor adds
          #     startup latency before the app binds, so raise it (max 1800)
          #   CS_APP_NAME / CS_CONTAINER ... platform-agnostic Falcon attribution
          # CS_CLOUD_SERVICE is deliberately NOT set: there is no App Service enum.
          az webapp config appsettings set -n "$APP" -g "$RG" --settings \
            WEBSITES_PORT=80 \
            WEBSITES_CONTAINER_START_TIME_LIMIT=600 \
            WEBSITES_ENABLE_APP_SERVICE_STORAGE=false \
            CS_APP_NAME="falcon-appservice-demo" \
            CS_CONTAINER="${APP}" \
            -o none

          az webapp restart -n "$APP" -g "$RG" -o none
          echo "Deployed ${IMAGE_REPO}:${TAG}"

      - name: Confirm image will be pulled via managed identity
        # Read from the config/web sub-resource, NOT `az webapp show --query
        # siteConfig.*` — that projection returns null even when the value IS set.
        run: |
          set -euo pipefail
          CFG=$(az resource show \
            --ids "/subscriptions/${SUB}/resourceGroups/${RG}/providers/Microsoft.Web/sites/${APP}/config/web" \
            --query "{acrMI:properties.acrUseManagedIdentityCreds,acrMIID:properties.acrUserManagedIdentityID}" -o json)
          MI=$(echo "$CFG" | jq -r .acrMI); MIID=$(echo "$CFG" | jq -r .acrMIID)
          if [ "$MI" != "true" ] || [ "$MIID" != "$CLIENT_ID" ]; then
            echo "::error::Managed-identity ACR pull is not configured (acrUseManagedIdentityCreds=${MI}, identity matches=$([ "$MIID" = "$CLIENT_ID" ] && echo yes || echo no))."
            exit 1
          fi
          echo "Managed-identity ACR pull configured with the deployment identity."
          REMAINING=$(az webapp config appsettings list -n "$APP" -g "$RG" \
            --query "[?starts_with(name,'DOCKER_REGISTRY_SERVER_')].name" -o tsv)
          if [ -n "$REMAINING" ]; then
            echo "::warning::Admin-credential settings still present: ${REMAINING}. The MI path may not actually be exercised."
          else
            echo "No admin-credential fallback present — the pull must use the identity."
          fi

      - name: Verify app responds with THIS build (sensor did not fail closed)
        id: probe
        # This is the load-bearing test. A body carrying this run's build id proves
        # the NEW container is serving, i.e. falcon-entrypoint started the sensor
        # AND chained to the app inside the App Service sandbox.
        env:
          DEPLOY_START: ${{ steps.deploy.outputs.deploy_start }}
        run: |
          set -euo pipefail
          echo "result=fail" >> $GITHUB_OUTPUT
          IMAGE="${ACR_NAME}.azurecr.io/${IMAGE_REPO}:${TAG}"
          [ -n "$EXPECTED_BUILD_ID" ] || { echo "::error::build-id is empty"; exit 1; }
          SITE="/subscriptions/${SUB}/resourceGroups/${RG}/providers/Microsoft.Web/sites/${APP}"
          FQDN=$(az webapp show -n "$APP" -g "$RG" --query defaultHostName -o tsv)
          echo "::add-mask::${FQDN}"

          # 1) The configured image must be exactly this run's image.
          FX=$(az resource show --ids "${SITE}/config/web" --query properties.linuxFxVersion -o tsv)
          [ "$FX" = "DOCKER|${IMAGE}" ] || { echo "::error::linuxFxVersion='${FX}' != 'DOCKER|${IMAGE}'"; exit 1; }

          # Fail fast on a startup failure of THIS run's container. Only lines after the
          # log first mentions this run's tag count — the previous container may itself
          # be crash-looping and would otherwise trip the check. Uses the ARM
          # containerlogs action (management plane), so SCM basic auth is not needed.
          startup_failed() {
            az rest --method post --url "https://management.azure.com${SITE}/containerlogs?api-version=2023-12-01" \
              --output-file docker.log >/dev/null 2>&1 || return 1
            awk -v s="$DEPLOY_START" -v t="$TAG" 'substr($1,1,19) >= s { if (index($0, t)) seen=1; if (seen) print }' docker.log \
              | grep -aE "Failed to start site|terminated during site startup|Container has finished running with exit code|exited with exit code" \
              | sed -E "$REDACT" | tail -5
          }

          # 2) Require this build's id. Budget = START_TIME_LIMIT(600) + pull.
          DEADLINE=$((SECONDS + 660)); OK=0; N=0
          while :; do
            BODY=$(curl -sS --max-time 10 -H 'Cache-Control: no-cache' "https://${FQDN}/health" 2>/dev/null || true)
            GOT=$(jq -r '.build_id // empty' <<<"$BODY" 2>/dev/null || true)
            if [ "$GOT" = "$EXPECTED_BUILD_ID" ]; then
              OK=$((OK+1))
              if [ "$OK" -ge 3 ]; then
                echo "/health reports build_id=${GOT} — the new container is serving."
                echo "result=pass" >> $GITHUB_OUTPUT; exit 0
              fi
            else
              OK=0; echo "  /health build_id='${GOT:-<none>}' (want ${EXPECTED_BUILD_ID})"
            fi
            N=$((N+1))
            if (( N % 3 == 0 )); then
              FAIL=$(startup_failed || true)
              if [ -n "$FAIL" ]; then echo "$FAIL"; echo "::error::New container failed startup (docker log lines above)"; exit 1; fi
            fi
            (( SECONDS < DEADLINE )) || { echo "::error::Endpoint never reported build_id=${EXPECTED_BUILD_ID} within 660s"; exit 1; }
            sleep 10
          done

      - name: Container logs (sensor startup evidence)
        if: always()
        continue-on-error: true
        # ARM containerlogs = the docker/container log (entrypoint chain included).
        # Deliberately NOT `az webapp log download`: that bundle includes Kudu request
        # traces with client IPs. Output is filtered and redacted anyway.
        run: |
          set +e
          SITE="/subscriptions/${SUB}/resourceGroups/${RG}/providers/Microsoft.Web/sites/${APP}"
          az rest --method post --url "https://management.azure.com${SITE}/containerlogs?api-version=2023-12-01" \
            --output-file docker.log >/dev/null 2>&1
          if [ -s docker.log ]; then
            echo "--- last lines mentioning falcon / CrowdStrike / entrypoint / container start ---"
            grep -aiE "falcon|crowdstrike|entrypoint|starting container|started|exit code" docker.log \
              | sed -E "$REDACT" | tail -40
          else
            echo "(no container log retrieved)"
          fi
          true

      - name: Deployment summary
        if: always()
        run: |
          echo "## 🚀 Azure App Service — ${{ steps.probe.outputs.result == 'pass' && 'deployed and verified' || 'deployment FAILED verification' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Scenario:** ${{ needs.build-scan-and-gate.outputs.scenario }} (passed the gate)" >> $GITHUB_STEP_SUMMARY
          echo "- **Image:** \`${IMAGE_REPO}:${TAG}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Platform:** Azure App Service (Web App for Containers), plan ${{ steps.ensure-plan.outputs.status }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Serving build id:** ${{ steps.probe.outputs.result == 'pass' && needs.build-scan-and-gate.outputs.build-id || 'not verified' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Attribution:** \`CS_APP_NAME\` + \`CS_CONTAINER\` (generic embedded path; \`CS_CLOUD_SERVICE\` intentionally unset)" >> $GITHUB_STEP_SUMMARY
          echo "- **Sensor AID:** verify in the Falcon console — Kudu runs in a separate sidecar container and cannot reach falconctl in the app container; the ACI job is the AID canary for this image." >> $GITHUB_STEP_SUMMARY

  # ---------------------------------------------------------------------------
  # Deploy: Azure Container Instances
  # ---------------------------------------------------------------------------
  # ACI has a tailored CrowdStrike deployment guide, so unlike App Service it gets
  # full console attribution. Differences from the ACA path:
  #   * CS_AZURE_CONTAINER_GROUP is ACI-specific (no ACA equivalent).
  #   * ACR pull by managed identity requires passing the SAME user-assigned identity
  #     to BOTH --assign-identity and --acr-identity. ACI does NOT support
  #     system-assigned identities for ACR pulls at all.
  #   * --command-line would override the falcon-entrypoint, same trap as ACA's
  #     --command. We do not pass it.
  #
  # This job is also the sensor-registration CANARY for the whole pipeline: ACI is
  # the only one of the three targets where `az container exec` works, so it is the
  # one place CI can prove the sensor got an AID. The AID itself is masked — it is
  # a tenant device identifier and the logs are public.
  # ---------------------------------------------------------------------------
  deploy-aci:
    name: Deploy to Azure Container Instances
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: build-scan-and-gate
    if: >-
      ${{ needs.build-scan-and-gate.outputs.scan-passed == 'true' &&
          (needs.build-scan-and-gate.outputs.deploy-target == 'aci' ||
           needs.build-scan-and-gate.outputs.deploy-target == 'all') }}
    environment: production
    concurrency:
      group: falcon-deploy-aci
      cancel-in-progress: false

    env:
      RG: ${{ secrets.RESOURCE_GROUP }}
      CG: ${{ secrets.ACI_NAME }}
      DNS: ${{ secrets.ACI_DNS_LABEL }}
      ACR_NAME: ${{ secrets.ACR_NAME }}
      SUB: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      LOCATION: ${{ vars.AZURE_LOCATION }}
      TAG: ${{ needs.build-scan-and-gate.outputs.patched-image-tag }}
      EXPECTED_BUILD_ID: ${{ needs.build-scan-and-gate.outputs.build-id }}
      REDACT: 's/([0-9]{1,3}\.){3}[0-9]{1,3}/<ip>/g; s/[0-9a-fA-F]{32}/<hex32>/g'

    steps:
      - name: Azure login via OIDC
        uses: azure/login@7ddb5af1ef8758cf1353cf3b42f940aee27ba21c # v3.0.2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy container group to ACI
        id: deploy
        run: |
          set -euo pipefail
          IMAGE="${ACR_NAME}.azurecr.io/${IMAGE_REPO}:${TAG}"

          UAMI_ID=$(az identity list -g "$RG" --query "[?clientId=='${CLIENT_ID}'].id | [0]" -o tsv)
          if [ -z "$UAMI_ID" ]; then
            echo "::error::Could not resolve the user-assigned identity in the resource group"; exit 1
          fi
          echo "::add-mask::${UAMI_ID}"

          # ACI container groups are effectively immutable — you cannot swap the image
          # on a running group. Delete and recreate for a deterministic deploy.
          if az container show -n "$CG" -g "$RG" -o none 2>/dev/null; then
            echo "Deleting existing container group..."
            az container delete -n "$CG" -g "$RG" --yes -o none
          fi

          echo "Creating container group with ${IMAGE_REPO}:${TAG}..."
          # NOTE: no --registry-username/--registry-password. Pull is via the managed
          # identity, which is why the same identity goes to --acr-identity and
          # --assign-identity. If the identity lacks AcrPull this FAILS LOUDLY rather
          # than silently falling back to admin credentials.
          az container create -n "$CG" -g "$RG" \
            --location "$LOCATION" \
            --image "$IMAGE" \
            --os-type Linux \
            --cpu 1 --memory 1.5 \
            --ports 80 \
            --dns-name-label "$DNS" \
            --restart-policy OnFailure \
            --assign-identity "$UAMI_ID" \
            --acr-identity "$UAMI_ID" \
            --environment-variables \
              CS_CLOUD_SERVICE=ACI \
              CS_AZURE_CONTAINER_GROUP="$CG" \
              CS_AZURE_RESOURCE_GROUP="$RG" \
              CS_AZURE_SUBSCRIPTION="$SUB" \
              CS_CONTAINER="$CG" \
              CS_APP_NAME="falcon-aci-demo" \
            -o none

          STATE=$(az container show -n "$CG" -g "$RG" --query instanceView.state -o tsv)
          echo "Container group state: ${STATE}"

      - name: Confirm image was pulled via managed identity
        # A pull with an identity (and no username) configured on the group is the
        # evidence we want. Printed as booleans, not resource ids.
        run: |
          set -euo pipefail
          az container show -n "$CG" -g "$RG" \
            --query "imageRegistryCredentials[].{server_is_acr: ends_with(server, '.azurecr.io'), uses_identity: identity != \`null\`, has_username: username != \`null\`}" -o table
          echo "=== container events ==="
          az container show -n "$CG" -g "$RG" \
            --query "containers[].instanceView.events[].{t:type,name:name,msg:message}" -o table | sed -E "$REDACT"

      - name: Verify app responds with THIS build (sensor did not fail closed)
        id: probe
        run: |
          set -euo pipefail
          echo "result=fail" >> $GITHUB_OUTPUT
          IMAGE="${ACR_NAME}.azurecr.io/${IMAGE_REPO}:${TAG}"
          [ -n "$EXPECTED_BUILD_ID" ] || { echo "::error::build-id is empty"; exit 1; }
          DEADLINE=$((SECONDS + 420)); OK=0
          while :; do
            J=$(az container show -n "$CG" -g "$RG" -o json)
            FQDN=$(jq -r '.ipAddress.fqdn // ""' <<<"$J"); [ -n "$FQDN" ] && echo "::add-mask::${FQDN}"
            IP=$(jq -r '.ipAddress.ip // ""' <<<"$J");     [ -n "$IP" ] && echo "::add-mask::${IP}"
            IMG=$(jq -r '.containers[0].image' <<<"$J")
            GSTATE=$(jq -r '.instanceView.state // ""' <<<"$J")
            CSTATE=$(jq -r '.containers[0].instanceView.currentState.state // ""' <<<"$J")
            EXITC=$(jq -r '.containers[0].instanceView.currentState.exitCode // ""' <<<"$J")
            DETAIL=$(jq -r '.containers[0].instanceView.currentState.detailStatus // ""' <<<"$J")
            RESTARTS=$(jq -r '.containers[0].instanceView.restartCount // 0' <<<"$J")
            echo "  group=${GSTATE} container=${CSTATE} exit=${EXITC} restarts=${RESTARTS}"

            [ "$IMG" = "$IMAGE" ] || { echo "::error::Group image ${IMG} != ${IMAGE}"; exit 1; }
            case "${GSTATE}/${CSTATE}" in
              */Terminated|Succeeded/*|Failed/*|Stopped/*)
                echo "::error::Container is not running (group=${GSTATE}, container=${CSTATE}, exitCode=${EXITC}, ${DETAIL}). A web workload must not exit; exit 0 means CMD ran to completion (not a server)."
                exit 1 ;;
            esac
            [ "$RESTARTS" -gt 0 ] && { echo "::error::Container restarted ${RESTARTS}x (non-zero exit under OnFailure)"; exit 1; }

            if [ "$CSTATE" = "Running" ] && [ -n "$FQDN" ]; then
              BODY=$(curl -sS --max-time 10 "http://${FQDN}/health" 2>/dev/null || true)
              GOT=$(jq -r '.build_id // empty' <<<"$BODY" 2>/dev/null || true)
              if [ "$GOT" = "$EXPECTED_BUILD_ID" ]; then
                OK=$((OK+1))
                if [ "$OK" -ge 3 ]; then
                  echo "/health reports build_id=${GOT}."
                  echo "result=pass" >> $GITHUB_OUTPUT; exit 0
                fi
              else
                OK=0; echo "  /health build_id='${GOT:-<none>}' (want ${EXPECTED_BUILD_ID})"
              fi
            fi
            (( SECONDS < DEADLINE )) || { echo "::error::Endpoint never reported build_id=${EXPECTED_BUILD_ID} within 420s"; exit 1; }
            sleep 10
          done

      - name: Container logs (sensor startup evidence)
        if: always()
        continue-on-error: true
        run: |
          set +e
          echo "=== container log (last 60 lines, IPs and 32-hex ids redacted) ==="
          az container logs -n "$CG" -g "$RG" 2>&1 | sed -E "$REDACT" | tail -60
          true

      - name: Verify Falcon sensor got an AID (authoritative)
        id: aid
        if: always()
        continue-on-error: true
        # We deliberately use falconctl rather than `ps`: the sensor terminates
        # processes that read its /proc entries. The AID is masked BEFORE anything
        # is printed — it is a tenant device id and this log is public.
        run: |
          set +e
          CSTATE=$(az container show -n "$CG" -g "$RG" --query "containers[0].instanceView.currentState.state" -o tsv 2>/dev/null)
          if [ "$CSTATE" != "Running" ]; then
            echo "::warning::Container is not running (state=${CSTATE:-unknown}); cannot query the sensor."
            echo "result=container-not-running" >> $GITHUB_OUTPUT
            exit 0
          fi
          OUT=$(az container exec -n "$CG" -g "$RG" \
            --exec-command "/opt/CrowdStrike/rootfs/bin/falconctl -g --aid" 2>&1)
          AID=$(echo "$OUT" | grep -oiE "[0-9a-f]{32}" | head -1)
          if [ -n "$AID" ]; then
            echo "::add-mask::${AID}"
            echo "✅ Sensor registered — falconctl returned an AID (masked)."
            echo "result=confirmed" >> $GITHUB_OUTPUT
          else
            echo "$OUT" | sed -E "$REDACT"
            echo "::warning::No AID returned. Could be exec/TTY limitations in CI rather than a sensor problem — check the container logs above and the Falcon console."
            echo "result=inconclusive" >> $GITHUB_OUTPUT
          fi
          true

      - name: Deployment summary
        if: always()
        run: |
          echo "## 🚀 Azure Container Instances — ${{ steps.probe.outputs.result == 'pass' && 'deployed and verified' || 'deployment FAILED verification' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Scenario:** ${{ needs.build-scan-and-gate.outputs.scenario }} (passed the gate)" >> $GITHUB_STEP_SUMMARY
          echo "- **Image:** \`${IMAGE_REPO}:${TAG}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Serving build id:** ${{ steps.probe.outputs.result == 'pass' && needs.build-scan-and-gate.outputs.build-id || 'not verified' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Sensor AID:** ${{ steps.aid.outputs.result || 'not run' }} (value masked)" >> $GITHUB_STEP_SUMMARY
          echo "- **Attribution:** \`CS_CLOUD_SERVICE=ACI\` + \`CS_AZURE_CONTAINER_GROUP\` (runtime)" >> $GITHUB_STEP_SUMMARY
