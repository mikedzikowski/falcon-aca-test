# falcon-aca-demo.yml
# Purpose: GitHub Actions workflow to patch container images with CrowdStrike Falcon Container Security and deploy to Azure Container Apps
# Migration from Azure DevOps pipeline with improved security, reliability, and regional support

name: Build and Deploy Falcon Container Apps

on:
  workflow_dispatch:
    inputs:
      useDockerfile:
        type: boolean
        default: false
        description: 'Build from Dockerfile instead of mirroring nginx:latest'
      dockerfilePath:
        type: string
        default: './Dockerfile'
        description: 'Path to Dockerfile (if useDockerfile is true)'
      runFCSScan:
        type: boolean
        default: true
        description: 'Run Falcon Container Security scan on patched image'
      deployToACA:
        type: boolean
        default: false
        description: 'Deploy patched image to Azure Container Apps'
      falconRegion:
        type: choice
        default: 'us-1'
        description: 'CrowdStrike Falcon cloud region'
        options:
          - 'us-1'
          - 'us-2'
          - 'eu-1'
          - 'us-gov-1'
          - 'us-gov-2'
      failOnPolicyViolation:
        type: boolean
        default: true
        description: 'Fail deployment if FCS policy violations are found'
  push:
    branches: [main]
  schedule:
    # Run daily at 2:17 AM UTC (off-minute to spread load across CrowdStrike's infrastructure)
    - cron: '17 2 * * *'

# Prevent overlapping deploys on the same ref
concurrency:
  group: falcon-aca-${{ github.ref }}
  cancel-in-progress: false

permissions:
  id-token: write    # Required for Azure OIDC authentication
  contents: read     # Required to checkout repository

env:
  # Container image configuration - immutable tags based on commit SHA
  SHORT_SHA: ${{ github.sha }}
  BASE_IMAGE_TAG: myapp:${{ github.sha }}
  PATCHED_IMAGE_TAG: myapp:${{ github.sha }}-patched

jobs:
  build-scan-and-gate:
    name: Build, Patch, Scan & Gate
    runs-on: ubuntu-latest
    timeout-minutes: 45

    outputs:
      patched-image-ref: ${{ steps.patch-image.outputs.ref }}
      patched-image-digest: ${{ steps.patch-image.outputs.digest }}
      # NOTE: `passed`/`exit-code` are written by the fcs-summary step (which
      # parses the scan JSON), NOT by the fcs-scan action. Pointing these at
      # steps.fcs-scan.* silently yields "" so the deploy gate never matches.
      scan-passed: ${{ steps.fcs-summary.outputs.passed }}
      scan-exit-code: ${{ steps.fcs-summary.outputs.exit-code }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: CrowdStrike IaC Scan (shift-left, non-blocking)
        uses: crowdstrike/fcs-action@v2.0.2
        id: fcs-iac
        continue-on-error: true
        with:
          falcon_client_id: ${{ secrets.FALCON_CLIENT_ID }}
          falcon_region: ${{ inputs.falconRegion }}
          scan_type: 'iac'
          path: './'
          # Report only — surface findings but DO NOT gate the build.
          # This demonstrates shift-left scanning of any Dockerfiles,
          # CI configs, or infrastructure code in the repository.
          report_formats: 'json'
          output_path: './scan-iac.json'
          upload_results: true
          no_color: true
        env:
          FALCON_CLIENT_SECRET: ${{ secrets.FALCON_CLIENT_SECRET }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Set image variables
        id: vars
        run: |
          set -euo pipefail

          REGISTRY="${{ vars.ACR_NAME }}.azurecr.io"
          TAG=$(echo "$GITHUB_SHA" | cut -c1-8)

          echo "registry=${REGISTRY}" >> $GITHUB_OUTPUT
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "base_image=${REGISTRY}/${{ env.BASE_IMAGE_TAG }}" >> $GITHUB_OUTPUT
          echo "patched_image=${REGISTRY}/${{ env.PATCHED_IMAGE_TAG }}" >> $GITHUB_OUTPUT
          echo "sensor_image=${REGISTRY}/falcon-container:${TAG}" >> $GITHUB_OUTPUT

      - name: Set regional configuration
        id: region-config
        run: |
          set -euo pipefail

          # VERIFY - could not confirm current API base URLs via CrowdStrike MCP
          case "${{ inputs.falconRegion }}" in
            "us-1")
              API_BASE="https://api.crowdstrike.com"
              FCS_REGISTRY="registry.crowdstrike.com/fcs/us-1/release"
              ;;
            "us-2")
              API_BASE="https://api.us-2.crowdstrike.com"
              FCS_REGISTRY="registry.crowdstrike.com/fcs/us-2/release"
              ;;
            "eu-1")
              API_BASE="https://api.eu-1.crowdstrike.com"
              FCS_REGISTRY="registry.crowdstrike.com/fcs/eu-1/release"
              ;;
            "us-gov-1")
              API_BASE="https://api.laggar.gcw.crowdstrike.com"
              FCS_REGISTRY="registry.laggar.gcw.crowdstrike.com/fcs/us-gov-1/release"
              ;;
            "us-gov-2")
              API_BASE="https://api.alto.gcw.crowdstrike.com"
              FCS_REGISTRY="registry.alto.gcw.crowdstrike.com/fcs/us-gov-2/release"
              ;;
            *)
              echo "::error::Unsupported Falcon region: ${{ inputs.falconRegion }}"
              exit 1
              ;;
          esac

          echo "api-base=${API_BASE}" >> $GITHUB_OUTPUT
          echo "fcs-registry=${FCS_REGISTRY}" >> $GITHUB_OUTPUT

      - name: Azure login via OIDC
        uses: azure/login@7ddb5af1ef8758cf1353cf3b42f940aee27ba21c # v3.0.2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Login to Azure Container Registry
        run: |
          set -euo pipefail
          # Use az acr login instead of docker login to avoid credential helper conflicts
          az acr login --name ${{ vars.ACR_NAME }}
        timeout-minutes: 2

      - name: Build and push base image
        if: ${{ inputs.useDockerfile }}
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ${{ inputs.dockerfilePath }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.vars.outputs.base_image }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Mirror nginx image from Docker Hub to ACR
        if: ${{ !inputs.useDockerfile }}
        run: |
          set -euo pipefail

          echo "Pulling nginx:latest from Docker Hub..."
          docker pull nginx:latest

          echo "Tagging for ACR..."
          docker tag nginx:latest ${{ steps.vars.outputs.base_image }}

          echo "Pushing to ACR..."
          docker push ${{ steps.vars.outputs.base_image }}
        timeout-minutes: 5

      - name: Pull Falcon Container Sensor
        id: pull-sensor
        run: |
          set -euo pipefail

          echo "Downloading falcon-container-sensor-pull.sh v1.13.0..."
          curl -fsSL -o falcon-pull.sh \
            "https://github.com/CrowdStrike/falcon-scripts/releases/download/v1.13.0/falcon-container-sensor-pull.sh"
          chmod +x falcon-pull.sh

          echo "Pulling Falcon container sensor..."
          # VERIFY - could not confirm exact output format via CrowdStrike MCP
          SENSOR_OUTPUT=$(./falcon-pull.sh \
            --client-id "${{ secrets.FALCON_CLIENT_ID }}" \
            --client-secret "${{ secrets.FALCON_CLIENT_SECRET }}" \
            --type falcon-container \
            --platform x86_64 \
            --region "${{ inputs.falconRegion }}")

          # Extract sensor image reference - this parsing may be fragile
          SENSOR_IMAGE=$(echo "$SENSOR_OUTPUT" | grep -E "(Downloaded newer image for|Pull complete)" | tail -1 | awk '{print $NF}' || echo "")

          if [ -z "$SENSOR_IMAGE" ]; then
            echo "::error::Failed to extract sensor image reference from output"
            echo "Script output:"
            echo "$SENSOR_OUTPUT"
            exit 1
          fi

          echo "Sensor image: $SENSOR_IMAGE"

          # Tag sensor for ACR and push
          echo "Tagging sensor as ${{ steps.vars.outputs.sensor_image }}..."
          docker tag "$SENSOR_IMAGE" "${{ steps.vars.outputs.sensor_image }}"

          echo "Pushing sensor to ACR..."
          docker push "${{ steps.vars.outputs.sensor_image }}"

          echo "sensor-ref=${{ steps.vars.outputs.sensor_image }}" >> $GITHUB_OUTPUT

      - name: Patch image with Falcon sensor
        id: patch-image
        run: |
          set -euo pipefail

          BASE_IMAGE="${{ steps.vars.outputs.base_image }}"
          SENSOR_IMAGE="${{ steps.vars.outputs.sensor_image }}"
          TARGET_IMAGE="${{ steps.vars.outputs.patched_image }}"

          echo "Patching ${BASE_IMAGE} with sensor ${SENSOR_IMAGE}..."

          # VERIFY - could not confirm exact falconutil flags via CrowdStrike MCP
          PATCH_OUTPUT=$(docker run --user 0:0 \
            -v /var/run/docker.sock:/var/run/docker.sock \
            --rm "${SENSOR_IMAGE}" \
            falconutil patch-image \
            --source-image-uri "${BASE_IMAGE}" \
            --target-image-uri "${TARGET_IMAGE}" \
            --falcon-image-uri "${SENSOR_IMAGE}" \
            --image-pull-policy IfNotPresent \
            --resource-group "${{ vars.RESOURCE_GROUP }}" \
            --subscription "${{ vars.AZURE_SUBSCRIPTION_ID }}" \
            --cloud-service ACA \
            --cid "${{ secrets.FALCON_CID }}")

          echo "$PATCH_OUTPUT"

          # Extract patched image digest - parsing may be fragile
          PATCHED_DIGEST=$(echo "$PATCH_OUTPUT" | grep -E "writing image" | awk '{print $4}' || echo "")

          if [ -z "$PATCHED_DIGEST" ]; then
            echo "::warning::Could not extract digest from patch output, resolving from registry..."
            # Fallback: resolve digest from ACR
            PATCHED_DIGEST=$(az acr manifest show --name "${TARGET_IMAGE#*/}" --registry ${{ vars.ACR_NAME }} --query digest -o tsv)
          fi

          echo "Patched image digest: $PATCHED_DIGEST"
          echo "Patched image reference: $TARGET_IMAGE"

          echo "digest=${PATCHED_DIGEST}" >> $GITHUB_OUTPUT
          echo "ref=${TARGET_IMAGE}" >> $GITHUB_OUTPUT

      - name: CrowdStrike Image Scan (ExPRT-Critical gate)
        uses: crowdstrike/fcs-action@v2.0.2
        id: fcs-scan
        # The image-scan exit code is driven by the Falcon console Image
        # Assessment POLICY. The action SETS the exit-code output but
        # does not fail the build itself; the explicit gate step below acts on
        # it. Results are uploaded for the Falcon console pivot.
        with:
          falcon_client_id: ${{ secrets.FALCON_CLIENT_ID }}
          falcon_region: ${{ inputs.falconRegion }}
          scan_type: 'image'
          # Scan the patched image by its unique SHA-based tag
          image: ${{ steps.patch-image.outputs.ref }}
          minimum_exprt: 'critical'
          report_formats: 'json'
          output_path: './scan-image.json'
          show_full_description: false
          upload_results: true
          no_color: true
        env:
          FALCON_CLIENT_SECRET: ${{ secrets.FALCON_CLIENT_SECRET }}

      - name: Render FCS scan results & publish summary
        if: always()
        id: fcs-summary
        env:
          IMAGE: ${{ steps.patch-image.outputs.ref }}
          GATE_EXIT: ${{ steps.fcs-scan.outputs.exit-code }}
        run: |
          set +e
          SUMMARY=fcs-summary.md
          : > "$SUMMARY"

          # ---- Verdict heading ----
          if [ "${GATE_EXIT:-0}" != "0" ]; then
            echo "## ❌ Build blocked by Falcon image assessment" >> "$SUMMARY"
          else
            echo "## ✅ Falcon image assessment passed" >> "$SUMMARY"
          fi
          echo "" >> "$SUMMARY"
          SHORT_SHA=$(printf '%.8s' "$GITHUB_SHA")
          echo "**Image:** \`${IMAGE}\` &nbsp;|&nbsp; **Commit:** \`${SHORT_SHA}\` &nbsp;|&nbsp; **Scanned:** $(date -u '+%Y-%m-%d %H:%M UTC')" >> "$SUMMARY"
          echo "" >> "$SUMMARY"

          # ---- Image assessment (blocking gate) ----
          if [ -f scan-image.json ]; then
            echo "### Container Image Assessment (blocking)" >> "$SUMMARY"
            echo "" >> "$SUMMARY"
            CRIT=$(jq -r '.VulnerabilitiesSummary.severities.critical // 0' scan-image.json 2>/dev/null || echo 0)
            HIGH=$(jq -r '.VulnerabilitiesSummary.severities.high // 0' scan-image.json 2>/dev/null || echo 0)
            MED=$(jq -r '.VulnerabilitiesSummary.severities.medium // 0' scan-image.json 2>/dev/null || echo 0)
            LOW=$(jq -r '.VulnerabilitiesSummary.severities.low // 0' scan-image.json 2>/dev/null || echo 0)
            TOTAL=$(jq -r '.VulnerabilitiesSummary.count // 0' scan-image.json 2>/dev/null || echo 0)
            POLICY_DENY=$(jq -r '.PolicyResponse.deny // false' scan-image.json 2>/dev/null || echo false)
            POLICY_NAME=$(jq -r '.PolicyResponse.policy.name // "N/A"' scan-image.json 2>/dev/null || echo "N/A")
            echo "| Severity | Count |" >> "$SUMMARY"
            echo "|----------|-------|" >> "$SUMMARY"
            echo "| Critical | $CRIT |" >> "$SUMMARY"
            echo "| High | $HIGH |" >> "$SUMMARY"
            echo "| Medium | $MED |" >> "$SUMMARY"
            echo "| Low | $LOW |" >> "$SUMMARY"
            echo "| **Total** | **$TOTAL** |" >> "$SUMMARY"
            echo "" >> "$SUMMARY"
            echo "**Image Assessment Policy:** $POLICY_NAME &nbsp;|&nbsp; **Denied:** \`$POLICY_DENY\` &nbsp;|&nbsp; **Gate exit code:** \`${GATE_EXIT}\`" >> "$SUMMARY"
            echo "" >> "$SUMMARY"
            echo "<details><summary><b>View ExPRT-Critical / High CVEs</b></summary>" >> "$SUMMARY"
            echo "" >> "$SUMMARY"
            jq -r '.Vulnerabilities[]? | select(.Vulnerability != null) | select(.Vulnerability.Details.cps_rating.CurrentRating.Rating == "CRITICAL" or .Vulnerability.Details.severity == "CRITICAL" or .Vulnerability.Details.severity == "HIGH") | "##### \(.Vulnerability.CVEID // "CVE-UNKNOWN")\n\n**Package:** \(.Vulnerability.Product.Product // "N/A") \(.Vulnerability.Product.MajorVersion // "")\n\n**Severity:** \(.Vulnerability.Details.severity) | **ExPRT Rating:** \(.Vulnerability.Details.cps_rating.CurrentRating.Rating // "N/A") | **CVSS:** \(.Vulnerability.Details.base_score // "N/A")\n\n\(.Vulnerability.Details.description // "")\n\n**Remediation:** \(if .Vulnerability.Remediation then (.Vulnerability.Remediation | join(", ")) else "Update to the latest patched version" end)\n\n---\n"' scan-image.json >> "$SUMMARY" 2>/dev/null || echo "*CVE details unavailable — see Falcon console.*" >> "$SUMMARY"
            echo "" >> "$SUMMARY"
            echo "</details>" >> "$SUMMARY"
            echo "" >> "$SUMMARY"
          fi

          # ---- IaC scan (shift-left, non-blocking) ----
          if [ -f scan-iac.json ]; then
            echo "### Infrastructure-as-Code Scan (non-blocking)" >> "$SUMMARY"
            IAC_TOTAL=$(jq -r '.detection_summary.total // 0' scan-iac.json 2>/dev/null || echo 0)
            IAC_HIGH=$(jq -r '.detection_summary.high // 0' scan-iac.json 2>/dev/null || echo 0)
            IAC_MED=$(jq -r '.detection_summary.medium // 0' scan-iac.json 2>/dev/null || echo 0)
            IAC_LOW=$(jq -r '.detection_summary.low // 0' scan-iac.json 2>/dev/null || echo 0)
            IAC_INFO=$(jq -r '.detection_summary.informational // 0' scan-iac.json 2>/dev/null || echo 0)
            echo "" >> "$SUMMARY"
            echo "| Severity | Count |" >> "$SUMMARY"
            echo "|----------|-------|" >> "$SUMMARY"
            echo "| High | $IAC_HIGH |" >> "$SUMMARY"
            echo "| Medium | $IAC_MED |" >> "$SUMMARY"
            echo "| Low | $IAC_LOW |" >> "$SUMMARY"
            echo "| Informational | $IAC_INFO |" >> "$SUMMARY"
            echo "| **Total** | **$IAC_TOTAL** |" >> "$SUMMARY"
            echo "" >> "$SUMMARY"
            echo "> This scans Dockerfiles, CI/CD configs, and any infrastructure code for security misconfigurations." >> "$SUMMARY"
            echo "" >> "$SUMMARY"
            if [ "$IAC_TOTAL" -gt 0 ]; then
              echo "<details><summary><b>View IaC findings</b></summary>" >> "$SUMMARY"
              echo "" >> "$SUMMARY"
              jq -r '.rule_detections[]? | select(.severity == "High" or .severity == "Medium") | "##### \(.rule_name) (\(.severity))\n\n**Category:** \(.rule_category) | **Platform:** \(.platform)\n\n\(.description)\n\n\(.detections[]? | "- `\(.file):\(.line)` — \(.resource_type) `\(.resource_name)`\n  - Issue: \(.reason)\n  - Fix: \(.recommendation)")\n\n---\n"' scan-iac.json >> "$SUMMARY" 2>/dev/null || echo "*Details unavailable — see Falcon console.*" >> "$SUMMARY"
              echo "" >> "$SUMMARY"
              echo "</details>" >> "$SUMMARY"
              echo "" >> "$SUMMARY"
            fi
          fi

          # Mirror to the run's job summary
          cat "$SUMMARY" >> "$GITHUB_STEP_SUMMARY"

          # Set outputs
          echo "passed=$([ "${GATE_EXIT:-0}" = "0" ] && echo "true" || echo "false")" >> $GITHUB_OUTPUT
          echo "exit-code=${GATE_EXIT:-0}" >> $GITHUB_OUTPUT
          true

      - name: Upload scan reports
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: falcon-scan-reports-${{ github.sha }}
          path: |
            scan-iac.json
            scan-image.json
            fcs-summary.md
          retention-days: 30

      - name: Fail on image-assessment policy violations
        if: ${{ inputs.failOnPolicyViolation && steps.fcs-scan.outputs.exit-code != '0' }}
        run: |
          echo "::error::Falcon image-assessment policy denied this image (exit code: ${{ steps.fcs-scan.outputs.exit-code }}). See the scan results in the job summary above — remediate the flagged CVE(s) and re-push to clear the gate."
          exit 1

  deploy:
    name: Deploy to Azure Container Apps
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build-scan-and-gate
    if: ${{ inputs.deployToACA && needs.build-scan-and-gate.outputs.scan-passed == 'true' }}
    environment: production  # Requires manual approval in GitHub environment settings

    steps:
      - name: Azure login via OIDC
        uses: azure/login@7ddb5af1ef8758cf1353cf3b42f940aee27ba21c # v3.0.2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Ensure Container Apps environment exists
        id: ensure-environment
        run: |
          set -euo pipefail

          RG="${{ vars.RESOURCE_GROUP }}"
          ENV_NAME="${{ vars.ACA_ENV_NAME }}"
          LOCATION="${{ vars.AZURE_LOCATION }}"

          echo "Checking if Container Apps environment '${ENV_NAME}' exists in resource group '${RG}'..."

          # Check if environment exists
          ENV_EXISTS=$(az containerapp env show \
            --name "${ENV_NAME}" \
            --resource-group "${RG}" \
            --query "name" -o tsv 2>/dev/null || echo "")

          if [ -n "$ENV_EXISTS" ]; then
            echo "✅ Container Apps environment '${ENV_NAME}' already exists"
            ENV_STATUS="exists"
          else
            echo "🔧 Creating Container Apps environment '${ENV_NAME}'..."

            # Create the environment with default configuration
            az containerapp env create \
              --name "${ENV_NAME}" \
              --resource-group "${RG}" \
              --location "${LOCATION}" \
              --logs-destination none \
              --output table

            echo "✅ Container Apps environment '${ENV_NAME}' created successfully"
            ENV_STATUS="created"
          fi

          echo "status=${ENV_STATUS}" >> $GITHUB_OUTPUT

      - name: Ensure Container App exists
        id: ensure-app
        run: |
          set -euo pipefail

          RG="${{ vars.RESOURCE_GROUP }}"
          APP_NAME="${{ vars.CONTAINER_APP_NAME }}"
          ENV_NAME="${{ vars.ACA_ENV_NAME }}"

          echo "Checking if Container App '${APP_NAME}' exists..."

          # Check if container app exists
          APP_EXISTS=$(az containerapp show \
            --name "${APP_NAME}" \
            --resource-group "${RG}" \
            --query "name" -o tsv 2>/dev/null || echo "")

          if [ -n "$APP_EXISTS" ]; then
            echo "✅ Container App '${APP_NAME}' already exists - will update with new image"
            APP_ACTION="update"
          else
            echo "🔧 Container App '${APP_NAME}' does not exist - will create"
            APP_ACTION="create"
          fi

          echo "action=${APP_ACTION}" >> $GITHUB_OUTPUT

      - name: Deploy to Azure Container Apps
        # Using Azure Container Apps deploy action for better integration vs raw az CLI
        # Trade-off: Action provides better revision management and rollback capabilities
        # vs az CLI which offers more granular control but requires manual revision handling
        uses: azure/container-apps-deploy-action@v2
        with:
          containerAppName: ${{ vars.CONTAINER_APP_NAME }}
          resourceGroup: ${{ vars.RESOURCE_GROUP }}
          containerAppEnvironment: ${{ vars.ACA_ENV_NAME }}
          imageToDeploy: ${{ needs.build-scan-and-gate.outputs.patched-image-ref }}
          targetPort: 80
          ingress: external
          # NOTE: do NOT set environmentVariables here — the action passes it as
          # `--replace-env-vars`, which is an UPDATE-only flag and is rejected by
          # `az containerapp create` on first deploy (exit code 2). nginx needs no
          # env vars anyway; set them via a later `az containerapp update` if required.

      - name: Deployment summary
        run: |
          echo "## 🚀 Deployment Complete" >> $GITHUB_STEP_SUMMARY
          echo "- **Image**: \`${{ needs.build-scan-and-gate.outputs.patched-image-ref }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Container App**: ${{ vars.CONTAINER_APP_NAME }} (${{ steps.ensure-app.outputs.action }})" >> $GITHUB_STEP_SUMMARY
          echo "- **Environment**: ${{ vars.ACA_ENV_NAME }} (${{ steps.ensure-environment.outputs.status }})" >> $GITHUB_STEP_SUMMARY
          echo "- **Resource Group**: ${{ vars.RESOURCE_GROUP }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Location**: ${{ vars.AZURE_LOCATION }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Scan Exit Code**: ${{ needs.build-scan-and-gate.outputs.scan-exit-code }}" >> $GITHUB_STEP_SUMMARY
